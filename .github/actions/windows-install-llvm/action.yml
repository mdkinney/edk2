name: 'Windows Install LLVM and add to PATH'
description: 'Windows use cache restore/save with LLVM installer to install LLVM and add it to PATH'
inputs:
  llvm_version:
    description: 'The LLVM version to install (e.g., 20.1.8)'
    required: true
  llvm_install_path:
    description: 'The path where LLVM is installed (e.g., C:\Program Files\LLVM)'
    required: false
    default: 'C:\Program Files\LLVM'
runs:
  using: 'composite'
  steps:
    - name: Restore CLANG ${{ inputs.llvm_version }} from cache
      id: cache-clang
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.llvm_install_path }}
        key: ${{ runner.os }}-LLVM-${{ inputs.llvm_version }}-win64.exe
    - name: Install CLANG ${{ inputs.llvm_version }}
      if: steps.cache-clang.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        curl -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/LLVM-${{ inputs.llvm_version }}-win64.exe
        llvm_install.exe /S
    - name: Save CLANG ${{ inputs.llvm_version }} to cache
      if: steps.cache-clang.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.llvm_install_path }}
        key: ${{ steps.cache-clang.outputs.cache-primary-key }}
    - name: Add CLANG ${{ inputs.llvm_version }} to PATH
      shell: cmd
      run: |
        PATH=${{ inputs.llvm_install_path }}\bin;%PATH%
        echo PATH=%PATH%>> %GITHUB_ENV%
        echo CLANG_BIN=${{ inputs.llvm_install_path }}\bin\>> %GITHUB_ENV%
