## @file
# Composite action that Installs Python in a virtual environment, installs
# pip requirements, and adds Python virtual environment to PATH.
# Caches the virtual environment to avoid re-installing on subsequent runs.
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##

name: 'Windows Install Python in venv and install pip-requirements.txt'
description: 'Windows use cache restore/save with Python venv installer and pip-requirements add it to PATH'
inputs:
  python-version:
    description: 'Python version to install (e.g., 3.12)'
    required: true
  pip-requirements:
    description: 'Path to pip requirements file'
    required: true
    default: 'pip-requirements.txt'
  cache-name-suffix:
    description: 'Suffix for cache name to allow multiple caches'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Restore cached venv
      id: cache-venv
      uses: actions/cache/restore@v5
      with:
        path: .venv
        key: ${{ runner.os }}-Python-${{ inputs.python-version }}-venv-${{ hashFiles(inputs.pip-requirements) }}${{ inputs.cache-name-suffix }}
    - name: Set up Python ${{ inputs.python-version }}
      if: steps.cache-venv.outputs.cache-hit != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Create and install venv if cache missed
      shell: cmd
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        PATH=%CD%\.venv\Scripts;%PATH%
        python -m pip install --upgrade pip
        pip install -r ${{ inputs.pip-requirements }}
        python --version
        pip --version
        pip list --verbose
    - name: Save venv cache
      uses: actions/cache/save@v5
      if: steps.cache-venv.outputs.cache-hit != 'true'
      with:
        path: .venv
        key: ${{ steps.cache-venv.outputs.cache-primary-key }}
    - name: Add venv to PATH
      shell: cmd
      run: |
        echo %CD%\.venv\Scripts>> %GITHUB_PATH%
    - name: List venv pip inventory
      shell: cmd
      run: |
        python --version
        pip --version
        pip list --verbose
