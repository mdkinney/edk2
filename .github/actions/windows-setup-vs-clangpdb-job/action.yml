## @file
# Composite action that sets up a Windows Visual Studio CLANGPDB environment for
# CI jobs that builds packages and uploads artifacts. Caching is usedto avoid
# re-installing LLVM, Python, Python modules, and git submodules on subsequent
# runs.
#
# * Installs LLVM with CLANGPDB support, adds LLVM to PATH, and sets CLANG_BIN
#   environment variable.
# * Installs Python in a virtual environment, installs edk2 pip requirements,
#   and adds Python virtual environment to PATH.
# * Installs git submodules using stuart_setup.
# * Sets up Stuart Tools, builds edk2 BaseTools, and sets NASM_PREFIX and
#   IASL_PREFIX environment variables.
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##

name: 'Windows Setup Visual Studio CLANGPDB Job'
description: 'Windows setup Visual Studio with CLANGPDB support for CI jobs'
inputs:
  llvm_version:
    description: 'The LLVM version to install (e.g., 20.1.8)'
    required: true
  llvm_install_path:
    description: 'The path where LLVM is installed (e.g., C:\Program Files\LLVM)'
    required: false
    default: 'C:\Program Files\LLVM'
  python-version:
    description: 'Python version to install (e.g., 3.12)'
    required: true
  stuart-ci-settings-file:
    description: 'Path to the stuart CI settings file (e.g. .pytool/CISettings.py)'
    required: true
  edk2-tools-build-params:
    description: 'Command line parameters for Edk2ToolsBuild.py (e.g. -t VS2022)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore CLANG ${{ inputs.llvm_version }} from cache
      id: cache-clang
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.llvm_install_path }}
        key: ${{ runner.os }}-LLVM-${{ inputs.llvm_version }}-win64.exe
    - name: Install CLANG ${{ inputs.llvm_version }}
      if: steps.cache-clang.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        curl -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.llvm_version }}/LLVM-${{ inputs.llvm_version }}-win64.exe
        llvm_install.exe /S
    - name: Save CLANG ${{ inputs.llvm_version }} to cache
      if: steps.cache-clang.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.llvm_install_path }}
        key: ${{ steps.cache-clang.outputs.cache-primary-key }}
    - name: Add CLANG ${{ inputs.llvm_version }} to PATH
      shell: cmd
      run: |
        PATH=${{ inputs.llvm_install_path }}\bin;%PATH%
        echo PATH=%PATH%>> %GITHUB_ENV%
        echo CLANG_BIN=${{ inputs.llvm_install_path }}\bin\>> %GITHUB_ENV%
    - name: Install Python in venv
      uses: ./.github/actions/windows-install-python-venv
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Git Submodules from stuart_setup
      uses: ./.github/actions/windows-install-git-submodules
      with:
        stuart-ci-settings-file: ${{ inputs.stuart-ci-settings-file }}
    - name: Set up Stuart Tools
      uses: ./.github/actions/windows-install-stuart-tools
      with:
        stuart-ci-settings-file: ${{ inputs.stuart-ci-settings-file }}
        edk2-tools-build-params: ${{ inputs.edk2-tools-build-params }}