## @file
# Composite action that sets up a Windows Visual Studio CLANGPDB environment for
# CI jobs that builds packages and uploads artifacts. Caching is used to avoid
# re-installing LLVM on subsequent runs.
#
# * Installs LLVM with CLANGPDB support, adds LLVM to PATH, and sets CLANG_BIN
#   environment variable.
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##

name: Windows Setup Visual Studio CLANGPDB Job
description: Windows setup Visual Studio with CLANGPDB support for CI jobs
inputs:
  vs-clang-llvm-version:
    description: The LLVM version to install (e.g., 22.1.8)
    required: true
  vs-clang-llvm-install-path:
    description: The path where LLVM is installed (e.g., C:\Program Files\LLVM)
    required: false
    default: 'C:\Program Files\LLVM'
runs:
  using: 'composite'
  steps:
    - name: Restore CLANG ${{ inputs.vs-clang-llvm-version }} from cache
      id: cache-clang
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.vs-clang-llvm-install-path }}
        key: ${{ runner.os }}-LLVM-${{ inputs.vs-clang-llvm-version }}-win64.exe
    - name: Install CLANG ${{ inputs.vs-clang-llvm-version }}
      if: ${{ steps.cache-clang.outputs.cache-hit != 'true' }}
      shell: cmd
      run: |
        curl -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.vs-clang-llvm-version }}/LLVM-${{ inputs.vs-clang-llvm-version }}-win64.exe
        llvm_install.exe /S
    - name: Save CLANG ${{ inputs.vs-clang-llvm-version }} to cache
      if: ${{ steps.cache-clang.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.vs-clang-llvm-install-path }}
        key: ${{ steps.cache-clang.outputs.cache-primary-key }}
    - name: Add CLANG ${{ inputs.vs-clang-llvm-version }} to PATH
      shell: cmd
      run: |
        PATH=${{ inputs.vs-clang-llvm-install-path }}\bin;%PATH%
        echo PATH=%PATH%>> %GITHUB_ENV%
        echo CLANG_BIN=${{ inputs.vs-clang-llvm-install-path }}\bin\>> %GITHUB_ENV%
