## @file
# Composite action that sets up a Windows Visual Studio CLANGPDB environment for
# CI jobs that builds packages and uploads artifacts. Caching is used to avoid
# re-installing LLVM on subsequent runs.
#
# * Installs LLVM with CLANGPDB support, sets CLANG_BIN, and adds the
#   LLVM runtime directory to PATH.
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##

name: Windows Setup Visual Studio CLANGPDB Job
description: Windows setup Visual Studio with CLANGPDB support for CI jobs
inputs:
  vs-clang-llvm-version:
    description: The LLVM version to install (e.g., 22.1.8)
    required: true
  vs-clang-llvm-install-path:
    description: The path where LLVM is installed (e.g., C:\Program Files\LLVM)
    required: false
    default: 'C:\Program Files\LLVM'
runs:
  using: 'composite'
  steps:
    - name: Restore CLANG ${{ inputs.vs-clang-llvm-version }} from cache
      id: cache-clang
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.vs-clang-llvm-install-path }}
        key: ${{ runner.os }}-LLVM-${{ inputs.vs-clang-llvm-version }}-win64.exe
    - name: Install CLANG ${{ inputs.vs-clang-llvm-version }}
      if: ${{ steps.cache-clang.outputs.cache-hit != 'true' }}
      shell: cmd
      run: |
        curl --fail -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.vs-clang-llvm-version }}/LLVM-${{ inputs.vs-clang-llvm-version }}-win64.exe
        if errorlevel 1 (
          curl --fail -SL --output llvm_install.msi https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ inputs.vs-clang-llvm-version }}/LLVM-${{ inputs.vs-clang-llvm-version }}-win64.msi
          if errorlevel 1 exit /b 1
          msiexec /i llvm_install.msi /qn /norestart
        ) else (
          llvm_install.exe /S
        )
    - name: Save CLANG ${{ inputs.vs-clang-llvm-version }} to cache
      if: ${{ steps.cache-clang.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.vs-clang-llvm-install-path }}
        key: ${{ steps.cache-clang.outputs.cache-primary-key }}
    - name: Add CLANG ${{ inputs.vs-clang-llvm-version }} to PATH
      shell: cmd
      run: |
        set "CLANG_BIN=${{ inputs.vs-clang-llvm-install-path }}\bin"
        set "CLANG_EXE=%CLANG_BIN%\clang.exe"
        for /f "delims=" %%i in ('"%CLANG_EXE%" --print-resource-dir') do (
          set "LLVM_RUNTIME=%%i\lib\windows"
        )
        if not defined LLVM_RUNTIME (
          echo ERROR: Could not determine the LLVM resource directory.
          exit /b 1
        )
        if not exist "%LLVM_RUNTIME%\clang_rt.profile-x86_64.lib" (
          echo ERROR: LLVM X64 profile runtime is missing.
          exit /b 1
        )
        if not exist "%LLVM_RUNTIME%\clang_rt.asan_dynamic-x86_64.lib" (
          echo ERROR: LLVM X64 AddressSanitizer runtime is missing.
          exit /b 1
        )
        if not exist "%LLVM_RUNTIME%\clang_rt.asan_dynamic-x86_64.dll" (
          echo ERROR: LLVM X64 AddressSanitizer DLL is missing.
          exit /b 1
        )
        set "ASAN_STATIC_THUNK=clang_rt.asan_static_runtime_thunk-x86_64.lib"
        if not exist "%LLVM_RUNTIME%\%ASAN_STATIC_THUNK%" (
          echo ERROR: LLVM X64 AddressSanitizer static runtime thunk is missing.
          exit /b 1
        )
        PATH=%CLANG_BIN%;%LLVM_RUNTIME%;%PATH%
        echo PATH=%PATH%>> %GITHUB_ENV%
        echo CLANG_BIN=%CLANG_BIN%\>> %GITHUB_ENV%
