name: 'Ubuntu Cache No Apt and Stuart Init'
description: 'Ubuntu save/restore cache and setup Stuart environment'
runs:
  using: "composite"
  steps:
    - name: Cache submodules
      id: cache-submodules
      uses: actions/cache@v4
      with:
        path: |
          .git/modules
        key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}
    - name: Restore cached venv
      id: cache-venv
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: ${{ runner.os }}-venv-${{ hashFiles('pip-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-venv-
    - name: Create and install venv if cache missed
      shell: bash
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install -r pip-requirements.txt
    - name: Save venv cache
      uses: actions/cache/save@v4
      if: steps.cache-venv.outputs.cache-hit != 'true'
      with:
        path: .venv
        key: ${{ steps.cache-venv.outputs.cache-primary-key }}
    - name: Set PATH to use venv
      shell: bash
      run: echo "PATH=$PWD/.venv/bin:$PATH" >> $GITHUB_ENV
