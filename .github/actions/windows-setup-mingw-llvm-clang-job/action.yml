## @file
# Composite action that sets up a Windows LLVM MINGW CLANG environment for
# CI jobs that builds packages and uploads artifacts. Caching is used to avoid
# re-installing LLVM on subsequent runs.
#
# * Installs MINGW LLVM with CLANG support, adds LLVM to PATH, and sets
#   CLANG_BIN environment variable.
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##

name: Windows Setup LLVM MINGW CLANG Job
description: Windows setup LLVM MINGW with CLANG support for CI jobs
inputs:
  llvm-mingw-version:
    description: The LLVM version to install (e.g., 20250709)
    required: true
  llvm-mingw-install-path:
    description: Install directory template ending in llvm-mingw-{version}-ucrt-x86_64; parent must exist.
    required: false
    default: 'C:\llvm-mingw-{version}-ucrt-x86_64'
runs:
  using: 'composite'
  steps:
    - name: Resolve LLVM MINGW install path
      id: resolve-install-path
      shell: cmd
      env:
        LLVM_MINGW_INSTALL_PATH_TEMPLATE: ${{ inputs.llvm-mingw-install-path }}
        LLVM_MINGW_VERSION: ${{ inputs.llvm-mingw-version }}
      run: |
        setlocal EnableDelayedExpansion
        set "installPath=%LLVM_MINGW_INSTALL_PATH_TEMPLATE%"
        set "installPath=!installPath:{version}=%LLVM_MINGW_VERSION%!"
        echo path=!installPath!>> "%GITHUB_OUTPUT%"
    - name: Restore LLVM MINGW ${{ inputs.llvm-mingw-version }} from cache
      id: cache-llvm-mingw
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.resolve-install-path.outputs.path }}
        key: ${{ runner.os }}-llvm-mingw-${{ inputs.llvm-mingw-version }}-ucrt-x86_64
    - name: Install LLVM MINGW ${{ inputs.llvm-mingw-version }}
      if: ${{ steps.cache-llvm-mingw.outputs.cache-hit != 'true' }}
      shell: cmd
      env:
        LLVM_MINGW_INSTALL_PATH: ${{ steps.resolve-install-path.outputs.path }}
        LLVM_MINGW_VERSION: ${{ inputs.llvm-mingw-version }}
      run: |
        for %%I in ("%LLVM_MINGW_INSTALL_PATH%") do set "LLVM_MINGW_INSTALL_PARENT=%%~dpI"
        curl --fail -L -o "llvm-mingw.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/%LLVM_MINGW_VERSION%/llvm-mingw-%LLVM_MINGW_VERSION%-ucrt-x86_64.zip"
        if errorlevel 1 exit /b %errorlevel%
        powershell -NoProfile -Command "Expand-Archive -Path 'llvm-mingw.zip' -DestinationPath $env:LLVM_MINGW_INSTALL_PARENT -Force -ErrorAction Stop"
        if errorlevel 1 exit /b %errorlevel%
    - name: Save LLVM MINGW ${{ inputs.llvm-mingw-version }} to cache
      if: ${{ steps.cache-llvm-mingw.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.resolve-install-path.outputs.path }}
        key: ${{ steps.cache-llvm-mingw.outputs.cache-primary-key }}
    - name: Add LLVM MINGW ${{ inputs.llvm-mingw-version }} to PATH
      shell: cmd
      env:
        LLVM_MINGW_INSTALL_PATH: ${{ steps.resolve-install-path.outputs.path }}
      run: |
        PATH=%LLVM_MINGW_INSTALL_PATH%\bin;%PATH%
        PATH=%PATH%;%LLVM_MINGW_INSTALL_PATH%\i686-w64-mingw32\bin
        echo PATH=%PATH%>> %GITHUB_ENV%
        echo CLANG_BIN=%LLVM_MINGW_INSTALL_PATH%\bin\>> %GITHUB_ENV%
        echo BASETOOLS_MINGW_PATH=%LLVM_MINGW_INSTALL_PATH%>> %GITHUB_ENV%
        echo CC=clang>> %GITHUB_ENV%
        echo CXX=clang++>> %GITHUB_ENV%
