## @file
# Composite action that Installs Python in a virtual environment, installs
# edk2 pip requirements, and adds Python virtual environment to PATH.
# Caches the virtual environment to avoid re-installing on subsequent runs.
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##

name: 'Linux Install Python in venv and install pip-requirements.txt'
description: 'Linux use cache restore/save with Python venv installer and pip-requirements add it to PATH'
inputs:
  python-version:
    description: 'Python version to install (e.g., 3.12)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore cached venv
      uses: actions/cache/restore@v5
      id: cache-venv
      with:
        path: .venv
        key: ${{ runner.os }}-Python-${{ inputs.python-version }}-venv-${{ hashFiles('pip-requirements.txt') }}
    - name: Set up Python ${{ inputs.python-version }}
      if: steps.cache-venv.outputs.cache-hit != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Create and install venv if cache missed
      shell: bash
      if: steps.cache-venv.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        echo "PATH=$GITHUB_WORKSPACE/.venv/bin:$PATH">> $GITHUB_ENV
        python -m pip install --upgrade pip
        pip install -r pip-requirements.txt
        pip list --verbose
    - name: Save venv cache
      uses: actions/cache/save@v5
      if: steps.cache-venv.outputs.cache-hit != 'true'
      with:
        path: .venv
        key: ${{ steps.cache-venv.outputs.cache-primary-key }}
    - name: Activate venv
      shell: bash
      if: steps.cache-venv.outputs.cache-hit == 'true'
      run: |
        echo "PATH=$GITHUB_WORKSPACE/.venv/bin:$PATH">> $GITHUB_ENV
        pip list --verbose
