## @file
# A workflow using Windows Visual Studio CLANGPDB tools that builds packages and
# uploads artifacts.
#
# Firmware Build Support:             CLANGPDB - IA32/X64
# Host-Based Unit Test Build Support: CLANGPDB - IA32/X64
# EmulatorPkg Build Support:          CLANGPDB - IA32/X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Windows Visual Studio CLANGPDB LLVM 20.1.8 Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - sandbox/master

jobs:
  build_windows_visual_studio_clangpdb_precheck:
    name: Build Windows Visual Studio CLANGPDB Precheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows Visual Studio CLANGPDB Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: 'vs-clangpdb'
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          stuart-ci-settings-file: '.pytool/CISettings.py'
          edk2-tools-build-params: '-t VS2022'
      - name: Build HelloWorld CLANGPDB
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a IA32 -a X64 -t CLANGPDB -b DEBUG -b RELEASE -b NOOPT -p MdeModulePkg/MdeModulePkg.dsc -m MdeModulePkg/Application/HelloWorld/HelloWorld.inf -j Build/HelloWorldClangPdbBuild.log >NUL
      - name: Build UnitTestFrameworkPkg X64 Unit Tests
        run: |
          stuart_ci_build -c ".pytool/CISettings.py" -a X64 -t NOOPT TOOL_CHAIN_TAG=CLANGPDB -p UnitTestFrameworkPkg
      - name: Build UnitTestFrameworkPkg IA32 Unit Tests
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a IA32 -t CLANGPDB -b NOOPT -p UnitTestFrameworkPkg/Test/UnitTestFrameworkPkgHostTest.dsc -j Build/UnitTestFrameworkPkgHostTestIA32.log >NUL
      - name: Build EmulatorPkg X64 Host Module
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a X64 -t CLANGPDB -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -m EmulatorPkg/Win/Host/WinHost.inf -j Build/EmulatorX64DebugBuild.log >NUL
      - name: Build EmulatorPkg IA32 Host Module
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a IA32 -t CLANGPDB -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -m EmulatorPkg/Win/Host/WinHost.inf -j Build/EmulatorIA32DebugBuild.log >NUL
      - name: Build OVMF Platform
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a IA32 -a X64 -t CLANGPDB -b DEBUG -p OvmfPkg/OvmfPkgIa32X64.dsc -D SMM_REQUIRE -j Build/OvmfIa32X64Build.log >NUL
      - name: Upload Windows Visual Studio CLANGPDB Precheck Logs
        uses: actions/upload-artifact@v6
        with:
          name: "Upload Windows Visual Studio CLANGPDB Precheck Logs"
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_windows_visual_studio_clangpdb_packages:
    name: Build Windows Visual Studio CLANGPDB Packages (${{ join(matrix.*, ' - ') }})
    needs: build_windows_visual_studio_clangpdb_precheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - DEBUG
          - RELEASE
        build_arch:
          - IA32
          - X64
        tool_chain_tag:
          - CLANGPDB
        build_package:
          - CryptoPkg,FatPkg,FmpDevicePkg,PcAtChipsetPkg,PrmPkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,SignedCapsulePkg
          - ArmPkg,ArmPlatformPkg,DynamicTablesPkg,EmbeddedPkg,NetworkPkg,RedfishPkg,MdeModulePkg,MdePkg,IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,SecurityPkg,ShellPkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows Visual Studio CLANGPDB Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: 'vs-clangpdb'
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          stuart-ci-settings-file: '.pytool/CISettings.py'
          edk2-tools-build-params: '-t VS2022'
      - name: Build Packages ${{ matrix.tool_chain_tag }}-VS
        shell: cmd
        run: |
          stuart_ci_build -c ".pytool/CISettings.py" -a ${{ matrix.build_arch }} -t ${{ matrix.build_type }} TOOL_CHAIN_TAG=${{ matrix.tool_chain_tag }} -p "${{ matrix.build_package }}"
      - name: Upload Windows Visual Studio CLANGPDB Packages Logs
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows Visual Studio CLANGPDB Packages Logs (${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }})
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_windows_visual_studio_clangpdb_noopt_unit_tests:
    name: Build Windows Visual Studio CLANGPDB Unit Tests (${{ join(matrix.*, ' - ') }})
    needs: build_windows_visual_studio_clangpdb_precheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - NOOPT
        build_arch:
          - X64
        tool_chain_tag:
          - CLANGPDB
        build_package:
          - CryptoPkg,FatPkg,FmpDevicePkg,PcAtChipsetPkg,PrmPkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,SignedCapsulePkg
          - ArmPkg,ArmPlatformPkg,DynamicTablesPkg,EmbeddedPkg,NetworkPkg,RedfishPkg,MdeModulePkg,MdePkg,IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,SecurityPkg,ShellPkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows Visual Studio CLANGPDB Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: 'vs-clangpdb'
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          stuart-ci-settings-file: '.pytool/CISettings.py'
          edk2-tools-build-params: '-t VS2022'
      - name: Build Windows Visual Studio CLANGPDB Unit Tests ${{ matrix.tool_chain_tag }}-VS
        shell: cmd
        run: |
          stuart_ci_build -c ".pytool/CISettings.py" -a ${{ matrix.build_arch }} -t ${{ matrix.build_type }} TOOL_CHAIN_TAG=${{ matrix.tool_chain_tag }} -p "${{ matrix.build_package }}"
      - name: Upload Windows Visual Studio CLANGPDB Unit Test Logs
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows Visual Studio CLANGPDB Unit Test Logs (${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }})
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_windows_visual_studio_clangpdb_emulatorpkg:
    name: Build Windows Visual Studio CLANGPDB EmulatorPkg
    needs: build_windows_visual_studio_clangpdb_precheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows Visual Studio CLANGPDB Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: 'vs-clangpdb'
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          stuart-ci-settings-file: '.pytool/CISettings.py'
          edk2-tools-build-params: '-t VS2022'
      - name: Build Windows Visual Studio CLANGPDB EmulatorPkg X64
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a X64 -t CLANGPDB -b NOOPT   -p EmulatorPkg/EmulatorPkg.dsc -D SECURE_BOOT_ENABLE   -j Build/EmulatorX64NooptBuild.log >NUL
          call build -a X64 -t CLANGPDB -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -D NETWORK_ENABLE=FALSE -j Build/EmulatorX64DebugBuild.log >NUL
          call build -a X64 -t CLANGPDB -b RELEASE -p EmulatorPkg/EmulatorPkg.dsc                         -j Build/EmulatorX64ReleaseBuild.log >NUL
      - name: Build Windows Visual Studio CLANGPDB EmulatorPkg IA32
        shell: cmd
        run: |
          call edksetup.bat VS2022
          call build -a IA32 -t CLANGPDB -b NOOPT   -p EmulatorPkg/EmulatorPkg.dsc -D SECURE_BOOT_ENABLE   -j Build/EmulatorIA32NooptBuild.log >NUL
          call build -a IA32 -t CLANGPDB -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -D NETWORK_ENABLE=FALSE -j Build/EmulatorIA32DebugBuild.log >NUL
          call build -a IA32 -t CLANGPDB -b RELEASE -p EmulatorPkg/EmulatorPkg.dsc                         -j Build/EmulatorIA32ReleaseBuild.log >NUL
      - name: Upload Windows Visual Studio CLANGPDB EmulatorPkg Logs
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows Visual Studio CLANGPDB EmulatorPkg Logs
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()
