name: Windows VS LLVM 20.1.8 CLANG Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - sandbox/master

jobs:
  build_windows_clang_ovmf_precheck:
    name: Build Windows CLANGPDB Precheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore CLANG 20.1.8
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files\LLVM
          key: ${{ runner.os }}-LLVM-20.1.8-win64.exe
          restore-keys: |
            ${{ runner.os }}-LLVM-20.1.8-win64.exe
      - name: Install CLANG 20.1.8
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe
          llvm_install.exe /S
      - name: Save CLANG 20.1.8
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files\LLVM
          key: ${{ steps.cache-clang.outputs.cache-primary-key }}
      - name: Add CLANG 20.1.8 to PATH
        shell: cmd
        run: |
          PATH=C:\Program Files\LLVM\bin;%PATH%
          echo PATH=%PATH% >> %GITHUB_ENV%
      - name: Restore cached venv
        uses: actions/cache/restore@v4
        id: cache-venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('pip-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-
      - name: Set up Python 3.12
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and install venv if cache missed
        shell: cmd
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%
          python -m pip install --upgrade pip
          pip install -r pip-requirements.txt
      - name: Save venv cache
        uses: actions/cache/save@v4
        if: steps.cache-venv.outputs.cache-hit != 'true'
        with:
          path: .venv
          key: ${{ steps.cache-venv.outputs.cache-primary-key }}
      - name: Activate venv
        shell: cmd
        run: |
          PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%
          echo PATH=%PATH% >> %GITHUB_ENV%
          pip list
      - name: Restore submodules
        id: cache-submodules
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-submodules-
      - name: 'Clone Submodules'
        run: stuart_setup -c ".pytool/CISettings.py"
      - name: Save submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: ${{ steps.cache-submodules.outputs.cache-primary-key }}
      - name: 'Download External Dependencies'
        run: stuart_update -c ".pytool/CISettings.py"
      - name: 'Build BaseTools'
        run: python BaseTools/Edk2ToolsBuild.py -t VS2022
      - name: 'Build HelloWorld CLANGPDB'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
          NASM_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\mu_nasm_extdep\\Windows-x86-64\\"
          IASL_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\edk2-acpica-iasl_extdep\\Windows-x86\\"
        run: |
          call edksetup.bat VS2022
          build -a IA32 -a X64 -t CLANGPDB -b DEBUG -b RELEASE -b NOOPT -p MdeModulePkg/MdeModulePkg.dsc -m MdeModulePkg/Application/HelloWorld/HelloWorld.inf -j Build/HelloWorldClangPdbBuild.log >NUL
      - name: 'Build UnitTestFrameworkPkg X64 Unit Tests'
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
        run: |
          stuart_ci_build -c ".pytool/CISettings.py" -a X64 -t NOOPT TOOL_CHAIN_TAG=CLANGPDB -p UnitTestFrameworkPkg
      - name: 'Build UnitTestFrameworkPkg IA32 Unit Tests'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
          NASM_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\mu_nasm_extdep\\Windows-x86-64\\"
          IASL_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\edk2-acpica-iasl_extdep\\Windows-x86\\"
        run: |
          call edksetup.bat VS2022
          build -a IA32 -t CLANGPDB -b NOOPT -p UnitTestFrameworkPkg/Test/UnitTestFrameworkPkgHostTest.dsc -j Build/UnitTestFrameworkPkgHostTestIA32.log >NUL
      - name: 'Build EmulatorPkg X64 Host Module'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
          NASM_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\mu_nasm_extdep\\Windows-x86-64\\"
          IASL_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\edk2-acpica-iasl_extdep\\Windows-x86\\"
        run: |
          call edksetup.bat VS2022
          build -a X64 -t CLANGPDB -b DEBUG -p EmulatorPkg/EmulatorPkg.dsc -m EmulatorPkg/Unix/Host/Host.inf -j Build/EmulatorX64Build.log >NUL
      - name: 'Build EmulatorPkg IA32 Host Module'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
          NASM_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\mu_nasm_extdep\\Windows-x86-64\\"
          IASL_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\edk2-acpica-iasl_extdep\\Windows-x86\\"
        run: |
          call edksetup.bat VS2022
          build -a IA32 -t CLANGPDB -b DEBUG -p EmulatorPkg/EmulatorPkg.dsc -m EmulatorPkg/Unix/Host/Host.inf -j Build/EmulatorIA32Build.log >NUL
      - name: 'Build OVMF Platform'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
          NASM_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\mu_nasm_extdep\\Windows-x86-64\\"
          IASL_PREFIX: "${{ github.workspace }}\\BaseTools\\Bin\\edk2-acpica-iasl_extdep\\Windows-x86\\"
        run: |
          call edksetup.bat VS2022
          build -a IA32 -a X64 -t CLANGPDB -b DEBUG -p OvmfPkg/OvmfPkgIa32X64.dsc -D SMM_REQUIRE -j Build/OvmfIa32X64Build.log >NUL
      - name: Upload Windows VS Clang Precheck Logs
        uses: actions/upload-artifact@v4
        with:
          name: "Upload Windows VS Clang Precheck Logs"
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_windows_clang:
    name: Build Windows (${{ join(matrix.*, ' - ') }})
    needs: build_windows_clang_ovmf_precheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - DEBUG
          - RELEASE
        build_arch:
          - IA32
          - X64
        tool_chain_tag:
          - CLANGPDB
        build_package:
          - CryptoPkg,FatPkg,FmpDevicePkg,PcAtChipsetPkg,PrmPkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,SignedCapsulePkg
          - ArmPkg,ArmPlatformPkg,DynamicTablesPkg,EmbeddedPkg,NetworkPkg,RedfishPkg,MdeModulePkg,MdePkg,IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,SecurityPkg,ShellPkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore CLANG 20.1.8
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files\LLVM
          key: ${{ runner.os }}-LLVM-20.1.8-win64.exe
          restore-keys: |
            ${{ runner.os }}-LLVM-20.1.8-win64.exe
      - name: Install CLANG 20.1.8
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe
          llvm_install.exe /S
      - name: Save CLANG 20.1.8
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files\LLVM
          key: ${{ steps.cache-clang.outputs.cache-primary-key }}
      - name: Add CLANG 20.1.8 to PATH
        shell: cmd
        run: |
          PATH=C:\Program Files\LLVM\bin;%PATH%
          echo PATH=%PATH% >> %GITHUB_ENV%
      - name: Restore cached venv
        uses: actions/cache/restore@v4
        id: cache-venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('pip-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-
      - name: Set up Python 3.12
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and install venv if cache missed
        shell: cmd
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%
          python -m pip install --upgrade pip
          pip install -r pip-requirements.txt
      - name: Save venv cache
        uses: actions/cache/save@v4
        if: steps.cache-venv.outputs.cache-hit != 'true'
        with:
          path: .venv
          key: ${{ steps.cache-venv.outputs.cache-primary-key }}
      - name: Activate venv
        shell: cmd
        run: |
          PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%
          echo PATH=%PATH% >> %GITHUB_ENV%
          pip list
      - name: Restore submodules
        id: cache-submodules
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-submodules-
      - name: 'Clone Submodules'
        run: stuart_setup -c ".pytool/CISettings.py"
      - name: Save submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: ${{ steps.cache-submodules.outputs.cache-primary-key }}
      - name: 'Download External Dependencies'
        run: stuart_update -c ".pytool/CISettings.py"
      - name: 'Build BaseTools'
        run: python BaseTools/Edk2ToolsBuild.py -t VS2022
      - name: 'Build Packages ${{ matrix.tool_chain_tag }}-VS'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
        run: |
          stuart_ci_build -c ".pytool/CISettings.py" -a ${{ matrix.build_arch }} -t ${{ matrix.build_type }} TOOL_CHAIN_TAG=${{ matrix.tool_chain_tag }} -p "${{ matrix.build_package }}"
      - name: Upload Windows VS Clang Logs
        uses: actions/upload-artifact@v4
        with:
          name: "Upload Windows VS Clang Logs (${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }})"
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_windows_clang_noopt_unit_tests:
    name: Build Windows Unit Test (${{ join(matrix.*, ' - ') }})
    needs: build_windows_clang_ovmf_precheck
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - NOOPT
        build_arch:
          - X64
        tool_chain_tag:
          - CLANGPDB
        build_package:
          - CryptoPkg,FatPkg,FmpDevicePkg,PcAtChipsetPkg,PrmPkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,SignedCapsulePkg
          - ArmPkg,ArmPlatformPkg,DynamicTablesPkg,EmbeddedPkg,NetworkPkg,RedfishPkg,MdeModulePkg,MdePkg,IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,SecurityPkg,ShellPkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore cached venv
        uses: actions/cache/restore@v4
        id: cache-venv
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ hashFiles('pip-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-
      - name: Set up Python 3.12
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create and install venv if cache missed
        shell: cmd
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%
          python -m pip install --upgrade pip
          pip install -r pip-requirements.txt
      - name: Save venv cache
        uses: actions/cache/save@v4
        if: steps.cache-venv.outputs.cache-hit != 'true'
        with:
          path: .venv
          key: ${{ steps.cache-venv.outputs.cache-primary-key }}
      - name: Activate venv
        shell: cmd
        run: |
          PATH=%GITHUB_WORKSPACE%\.venv\Scripts;%PATH%
          echo PATH=%PATH% >> %GITHUB_ENV%
      - name: Restore CLANG 20.1.8
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files\LLVM
          key: ${{ runner.os }}-LLVM-20.1.8-win64.exe
          restore-keys: |
            ${{ runner.os }}-LLVM-20.1.8-win64.exe
      - name: Install CLANG 20.1.8
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -SL --output llvm_install.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe
          llvm_install.exe /S
      - name: Save CLANG 20.1.8
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files\LLVM
          key: ${{ steps.cache-clang.outputs.cache-primary-key }}
      - name: Restore submodules
        id: cache-submodules
        uses: actions/cache/restore@v4
        with:
          path: .git/modules
          key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-submodules-
      - name: 'Clone Submodules'
        run: stuart_setup -c ".pytool/CISettings.py"
      - name: Save submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/modules
          key: ${{ steps.cache-submodules.outputs.cache-primary-key }}
      - name: 'Download External Dependencies'
        run: stuart_update -c ".pytool/CISettings.py"
      - name: 'Build BaseTools'
        run: python BaseTools/Edk2ToolsBuild.py -t VS2022
      - name: 'Build Packages ${{ matrix.tool_chain_tag }}-VS'
        shell: cmd
        env:
          CLANG_BIN: "C:\\Program Files\\LLVM\\bin\\"
        run: |
          PATH=C:\Program Files\LLVM\bin;%PATH%
          stuart_ci_build -c ".pytool/CISettings.py" -a ${{ matrix.build_arch }} -t ${{ matrix.build_type }} TOOL_CHAIN_TAG=${{ matrix.tool_chain_tag }} -p "${{ matrix.build_package }}"
      - name: Upload Windows VS Clang Unit Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: "Upload Windows VS Clang Unit Test Logs (${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }})"
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()
