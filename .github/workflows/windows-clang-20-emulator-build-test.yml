## @file
# A workflow using Windows to run package builds and uploads artifacts.
#
# Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
# Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
# EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Windows CLANG 20.1.8 Build Packages Test

on:
  workflow_call:
    inputs:
      windows-runs-on:
        description: The runner label for Windows jobs.
        required: true
        type: string
        default: 'windows-2025'
      windows-clang-installer:
        description: Windows CLANG installer (e.g., edk2-clang, llvm, vs-clangpdb, or none)
        required: true
        type: string
        default: 'none'
      python-version:
        description: The version of Python to use.
        required: true
        type: string
        default: '3.12'
      pip-requirements:
        description: Path to pip requirements file
        required: true
        type: string
        default: 'pip-requirements.txt'
      stuart-ci-settings-file:
        description: The path to the Stuart CI settings file.
        required: true
        type: string
        default: '.pytool/CISettings.py'
      edk2-tools-build-params:
        description: The EDK2 Tools build parameters.
        required: true
        type: string
        default: '-t CLANGPDB'
      edk-setup-params:
        description: The EDK2 setup parameters.
        required: false
        type: string
        default: 'Mingw-w64'
      build_arch_list:
        description: List of build architectures to test.
        required: true
        type: string
        default: '["IA32", "X64"]'
      tool_chain_tag_list:
        description: List of tool chain tags to test.
        required: true
        type: string
        default: '["CLANGPDB", "CLANGDWARF"]'

jobs:
  build_windows_clang_emulatorpkg_test:
    name: Build Windows ${{ matrix.tool_chain_tag }} ${{ matrix.build_arch }} EmulatorPkg Test
    runs-on: ${{ inputs.windows-runs-on }}
    strategy:
      fail-fast: false
      matrix:
        build_arch: ${{ fromJSON(inputs.build_arch_list) }}
        tool_chain_tag: ${{ fromJSON(inputs.tool_chain_tag_list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows CLANG Job
        uses: ./.github/actions/setup-job
        with:
          windows-clang-installer: ${{ inputs.windows-clang-installer }}
          python-version: ${{ inputs.python-version }}
          pip-requirements: ${{ inputs.pip-requirements }}
          stuart-ci-settings-file: ${{ inputs.stuart-ci-settings-file }}
          edk2-tools-build-params: ${{ inputs.edk2-tools-build-params }}
      - name: Build Windows EmulatorPkg DEBUG ${{ matrix.tool_chain_tag }} ${{ matrix.build_arch }}
        shell: cmd
        run: |
          call edksetup.bat ${{ inputs.edk-setup-params }}
          call build -a ${{ matrix.build_arch }} -t ${{ matrix.tool_chain_tag }} -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -D NETWORK_ENABLE=FALSE -j Build/Emulator${{ matrix.build_arch }}DebugBuild.log >NUL
      - name: Build Windows EmulatorPkg RELEASE ${{ matrix.tool_chain_tag }} ${{ matrix.build_arch }}
        shell: cmd
        run: |
          call edksetup.bat ${{ inputs.edk-setup-params }}
          call build -a ${{ matrix.build_arch }} -t ${{ matrix.tool_chain_tag }} -b RELEASE -p EmulatorPkg/EmulatorPkg.dsc                         -j Build/Emulator${{ matrix.build_arch }}ReleaseBuild.log >NUL
      - name: Build Windows EmulatorPkg NOOPT ${{ matrix.tool_chain_tag }} ${{ matrix.build_arch }}
        shell: cmd
        run: |
          call edksetup.bat ${{ inputs.edk-setup-params }}
          call build -a ${{ matrix.build_arch }} -t ${{ matrix.tool_chain_tag }} -b NOOPT   -p EmulatorPkg/EmulatorPkg.dsc -D SECURE_BOOT_ENABLE   -j Build/Emulator${{ matrix.build_arch }}NooptBuild.log >NUL
      - name: Upload Windows EmulatorPkg ${{ inputs.windows-clang-installer }} ${{ matrix.tool_chain_tag }} ${{ matrix.build_arch }} Logs
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows EmulatorPkg ${{ inputs.windows-clang-installer }} ${{ matrix.tool_chain_tag }} ${{ matrix.build_arch }} Logs
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()


