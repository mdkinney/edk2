## @file
# A workflow using Ubuntu CLANG tools that builds packages and uploads artifacts.
#
# Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
# Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
# EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Ubuntu CLANG 20.1.8 Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - sandbox/master
      - clang_ci_v5b

env:
  #
  # Package array that has similar execution times across 2 jobs.
  #
  PACKAGE_LISTS: '["ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,EmbeddedPkg,MdeModulePkg,MdePkg,CryptoPkg", "DynamicTablesPkg,IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,PrmPkg,NetworkPkg,SecurityPkg,ShellPkg,FmpDevicePkg,FatPkg,RedfishPkg,PcAtChipsetPkg,SignedCapsulePkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,EmulatorPkg"]'

jobs:
  set_package_lists:
    name: Set Package Lists
    runs-on: ubuntu-latest
    outputs:
      package-lists: ${{ steps.set-package-lists.outputs.package-lists }}
    steps:
      - name: Use Default Package Lists
        if: github.event_name != 'pull_request'
        run: |
          echo "LOCAL_PACKAGE_LISTS=${{ toJSON(env.PACKAGE_LISTS) }}" >> $GITHUB_ENV
      - name: Checkout Reference
        if: github.event_name != 'pull_request'
        #
        # If not PR, then use default checkout settings with fetch-depth of 1
        #
        uses: actions/checkout@v6
      - name: Get Number of Commit in PR
        if: github.event_name == 'pull_request'
        run: |
          echo "PR_COMMIT_COUNT=$((${{ github.event.pull_request.commits }} + 1))" >> $GITHUB_ENV
      - name: Checkout Pull Request
        if: github.event_name == 'pull_request'
        #
        # Checkout PR with fetch-depth of number of commits in PR + 1
        # This allows patch check to evaluate all commits in the PR, and for
        # stuart_pr_eval to evaluate the files modified over the entire PR.
        #
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.PR_COMMIT_COUNT }}
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Python in venv
        uses: ./.github/actions/linux-install-python-venv
        with:
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          cache-name-suffix: '-set-package-lists'
      - name: PatchCheck PR
        if: github.event_name == 'pull_request'
        run: |
          python BaseTools/Scripts/PatchCheck.py HEAD~${{ github.event.pull_request.commits }}..HEAD
      - name: Run stuart_pr_eval to generate Package List
        if: github.event_name == 'pull_request'
        run: |
          git log --oneline -n 10
          stuart_pr_eval -c .pytool/CISettings.py --pr-target HEAD~${{ github.event.pull_request.commits }} --output-csv-format-string {pkgcsv} -v
          PR_EVAL_LIST=$(stuart_pr_eval -c .pytool/CISettings.py --pr-target HEAD~${{ github.event.pull_request.commits }} --output-csv-format-string {pkgcsv})
          PR_EVAL_LIST=[\"$PR_EVAL_LIST\"]
          echo "PR_EVAL_LIST=$PR_EVAL_LIST" >> $GITHUB_ENV
      - name: Use stuart_pr_eval Package List
        if: github.event_name == 'pull_request'
        run: |
          echo "LOCAL_PACKAGE_LISTS=${{ toJSON(env.PR_EVAL_LIST) }}" >> $GITHUB_ENV
      - name: Set Package Lists
        id: set-package-lists
        run: |
          echo "package-lists=$LOCAL_PACKAGE_LISTS" >> $GITHUB_OUTPUT

  build_linux_clang_basic_acceptance_test:
    needs: set_package_lists
    uses: ./.github/workflows/ubuntu-clang-20-basic-acceptance-test.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGPDB'

  build_linux_clang_no_target_test:
    needs: set_package_lists
    uses: ./.github/workflows/ubuntu-clang-20-no-target-test.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGPDB'
      package-lists: ${{ needs.set_package_lists.outputs.package-lists }}

  build_linux_clang_packages_ia32_x64:
    needs: [set_package_lists, build_linux_clang_basic_acceptance_test, build_linux_clang_no_target_test]
    uses: ./.github/workflows/ubuntu-clang-20-package-build-test.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGPDB'
      build_type_list: '["DEBUG", "RELEASE"]'
      build_arch_list: '["IA32", "X64"]'
      tool_chain_tag_list: '["CLANGPDB", "CLANGDWARF"]'
      package-lists: ${{ needs.set_package_lists.outputs.package-lists }}

  build_linux_clangdwarf_aarch64_riscv64_packages:
    needs: [set_package_lists, build_linux_clang_basic_acceptance_test, build_linux_clang_no_target_test]
    uses: ./.github/workflows/ubuntu-clang-20-package-build-test.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGDWARF'
      build_type_list: '["DEBUG", "RELEASE"]'
      build_arch_list: '["AARCH64", "RISCV64"]'
      tool_chain_tag_list: '["CLANGDWARF"]'
      package-lists: ${{ needs.set_package_lists.outputs.package-lists }}

  build_linux_clangdwarf_noopt_unit_tests:
    needs: [set_package_lists, build_linux_clang_basic_acceptance_test, build_linux_clang_no_target_test]
    uses: ./.github/workflows/ubuntu-clang-20-package-build-test.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGDWARF'
      build_type_list: '["NOOPT"]'
      build_arch_list: '["X64"]'
      tool_chain_tag_list: '["CLANGDWARF"]'
      package-lists: ${{ needs.set_package_lists.outputs.package-lists }}

  build_linux_clangdwarf_emulatorpkg:
    needs: [set_package_lists, build_linux_clang_basic_acceptance_test, build_linux_clang_no_target_test]
    if: contains(needs.set_package_lists.outputs.package-lists, 'EmulatorPkg')
    uses: ./.github/workflows/ubuntu-clang-20-emulator-build.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGDWARF'
      build_arch_list: '["IA32", "X64"]'
      tool_chain_tag_list: '["CLANGDWARF"]'

  # Temp check for GCC and GCCNOLTO tool chains to build X64 NOOPT unit tests
  # TODO: Move to separate workflow after validation
  build_linux_gcc_noopt_unit_tests:
    needs: [set_package_lists, build_linux_clang_basic_acceptance_test, build_linux_clang_no_target_test]
    uses: ./.github/workflows/ubuntu-clang-20-package-build-test.yml
    with:
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t GCC'
      build_type_list: '["NOOPT"]'
      build_arch_list: '["X64"]'
      tool_chain_tag_list: '["GCC", "GCCNOLTO"]'
      package-lists: ${{ needs.set_package_lists.outputs.package-lists }}
