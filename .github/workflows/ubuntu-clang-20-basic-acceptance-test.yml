## @file
# A workflow using Ubuntu CLANG tools to run Basic Acceptance Tests (BAT)
# on packages and platforms and uploads artifacts.
#
# Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64/AARCH64/RISCV64
# Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
# EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Ubuntu CLANG 20.1.8 Basic Acceptance Test

on:
  workflow_call:
    inputs:
      linux-runs-on:
        description: The runner label for Linux jobs.
        required: true
        type: string
        default: 'ubuntu-24.04'
      linux-container-image:
        description: The container image for Linux jobs.
        required: true
        type: string
        default: 'ghcr.io/mdkinney/containers/ubuntu-24-build:latest'
      python-version:
        description: The version of Python to use.
        required: true
        type: string
        default: '3.12'
      pip-requirements:
        description: Path to pip requirements file
        required: true
        type: string
        default: 'pip-requirements.txt'
      stuart-ci-settings-file:
        description: The path to the Stuart CI settings file.
        required: true
        type: string
        default: '.pytool/CISettings.py'
      edk2-tools-build-params:
        description: The EDK2 Tools build parameters.
        required: true
        type: string
        default: '-t CLANGPDB'

jobs:
  build_linux_clang_packages_basic_acceptance_test:
    name: Build Linux CLANGPDB CLANGDWARF Packages Basic Acceptance Test
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: ${{ inputs.linux-container-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Linux CLANG Job
        uses: ./.github/actions/setup-job
        with:
          linux-host-compiler: 'clang'
          python-version: ${{ inputs.python-version }}
          pip-requirements: ${{ inputs.pip-requirements }}
          stuart-ci-settings-file: ${{ inputs.stuart-ci-settings-file }}
          edk2-tools-build-params: ${{ inputs.edk2-tools-build-params }}
      - name: Stuart Build HelloWorld CLANGPDB
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}" \
              --disable-all CompilerPlugin=run                       \
              TOOL_CHAIN_TAG=CLANGPDB                                \
              -t DEBUG,RELEASE,NOOPT -a X64,IA32                     \
              -p MdeModulePkg                                        \
              BUILDMODULE=MdeModulePkg/Application/HelloWorld/HelloWorld.inf
      - name: Stuart Build HelloWorld CLANGDWARF
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}" \
              --disable-all CompilerPlugin=run                       \
              TOOL_CHAIN_TAG=CLANGDWARF                              \
              -t DEBUG,RELEASE,NOOPT -a X64,IA32,AARCH64,RISCV64     \
              -p MdeModulePkg                                        \
              BUILDMODULE=MdeModulePkg/Application/HelloWorld/HelloWorld.inf
      - name: Stuart Build UnitTestFrameworkPkg X64 Unit Tests
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}"     \
              --disable-all DISABLE_DEBUG_MACRO_CHECK                    \
              HostUnitTestCompilerPlugin=run HostBasedUnitTestRunner=run \
              TOOL_CHAIN_TAG=CLANGDWARF -t NOOPT -a X64                  \
              -p UnitTestFrameworkPkg                                    \
              BUILDMODULE=UnitTestFrameworkPkg/Test/GoogleTest/Sample/SampleGoogleTest/SampleGoogleTestHost.inf
      - name: Stuart Build UnitTestFrameworkPkg IA32 Unit Tests
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}"     \
              --disable-all DISABLE_DEBUG_MACRO_CHECK                    \
              HostUnitTestCompilerPlugin=run HostBasedUnitTestRunner=run \
              TOOL_CHAIN_TAG=CLANGDWARF -t NOOPT -a IA32                 \
              -p UnitTestFrameworkPkg                                    \
              BUILDMODULE=UnitTestFrameworkPkg/Test/GoogleTest/Sample/SampleGoogleTest/SampleGoogleTestHost.inf
      - name: Upload Linux CLANGPDB CLANGDWARF Packages Basic Acceptance Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: Upload Linux CLANGPDB CLANGDWARF Packages Basic Acceptance Test Logs
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_linux_clang_platforms_basic_acceptance_test:
    name: Build Linux CLANGPDB CLANGDWARF Platforms Basic Acceptance Test
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: 'ghcr.io/mdkinney/containers/ubuntu-24-test:latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Linux CLANG Job
        uses: ./.github/actions/setup-job
        with:
          linux-host-compiler: 'clang'
          python-version: ${{ inputs.python-version }}
          pip-requirements: ${{ inputs.pip-requirements }}
          stuart-ci-settings-file: ${{ inputs.stuart-ci-settings-file }}
          edk2-tools-build-params: ${{ inputs.edk2-tools-build-params }}
      - name: Stuart Update EmulatorPkg
        run: stuart_update -c EmulatorPkg/PlatformCI/PlatformBuild.py
      - name: Stuart Build EmulatorPkg X64 Unix Host Module
        run: |
          stuart_build -c EmulatorPkg/PlatformCI/PlatformBuild.py \
              DISABLE_DEBUG_MACRO_CHECK                           \
              TOOL_CHAIN_TAG=CLANGDWARF -a X64                    \
              BUILDMODULE=EmulatorPkg/Unix/Host/Host.inf
      - name: Stuart Build EmulatorPkg IA32 Unix Host Module
        run: |
          stuart_build -c EmulatorPkg/PlatformCI/PlatformBuild.py \
              DISABLE_DEBUG_MACRO_CHECK                           \
              TOOL_CHAIN_TAG=CLANGDWARF -a IA32                   \
              BUILDMODULE=EmulatorPkg/Unix/Host/Host.inf
      - name: Stuart Update OvmfPkg
        run: |
          stuart_update -c OvmfPkg/PlatformCI/PlatformBuild.py
      - name: Stuart Build and Boot OVMF IA32/X64 Platform
        run: |
          stuart_build -c OvmfPkg/PlatformCI/PlatformBuild.py \
              -a IA32,X64 TOOL_CHAIN_TAG=CLANGPDB             \
              BLD_*_NETWORK_ENABLE=FALSE                      \
              --FLASHROM MAKE_STARTUP_NSH=TRUE QEMU_HEADLESS=TRUE
      - name: Upload Linux CLANGPDB CLANGDWARF Platforms Basic Acceptance Test Logs
        uses: actions/upload-artifact@v4
        with:
          name: Upload Linux CLANGPDB CLANGDWARF Platforms Basic Acceptance Test Logs
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()
