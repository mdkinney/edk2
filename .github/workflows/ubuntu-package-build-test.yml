name: Ubuntu Build Packages Test

on:
  workflow_call:
    inputs:
      linux-runs-on:
        description: The runner label for Linux jobs.
        required: true
        type: string
        default: 'ubuntu-24.04'
      linux-container-image:
        description: The container image for Linux jobs.
        required: true
        type: string
        default: 'ghcr.io/tianocore/containers/ubuntu-24-build:latest'
      linux-host-compiler:
        description: Linux Host Compiler (e.g., clang, gcc)
        required: false
        type: string
        default: 'clang'
      python-version:
        description: The version of Python to use.
        required: true
        type: string
        default: '3.12'
      pip-requirements:
        description: Path to pip requirements file
        required: true
        type: string
        default: 'pip-requirements.txt'
      stuart-ci-settings-file:
        description: The path to the Stuart CI settings file.
        required: true
        type: string
        default: '.pytool/CISettings.py'
      edk2-tools-build-params:
        description: The EDK2 Tools build parameters.
        required: true
        type: string
        default: '-t CLANGPDB'
      build-type-list:
        description: List of build types to test.
        required: true
        type: string
        default: '["DEBUG", "RELEASE"]'
      build-arch-list:
        description: List of build architectures to test.
        required: true
        type: string
        default: '["IA32", "X64"]'
      tool-chain-tag-list:
        description: List of tool chain tags to test.
        required: true
        type: string
        default: '["CLANGPDB", "CLANGDWARF"]'
      package-lists:
        description: List of package lists to test.
        required: true
        type: string
        default: '["ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,DynamicTablesPkg,EmbeddedPkg,MdeModulePkg,MdePkg,CryptoPkg", "IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,PrmPkg,NetworkPkg,SecurityPkg,ShellPkg,FmpDevicePkg,FatPkg,RedfishPkg,PcAtChipsetPkg,SignedCapsulePkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,EmulatorPkg"]'
      skip-filter-list:
        description: List of filter criteria to skip.
        required: false
        type: string
        # '[{"tool_chain_tag": "GCCNOLTO", "build_arch": "RISCV64"}]'
        default: ''
      continue-on-error-filter-list:
        description: List of filter criteria to continue on error.
        required: false
        type: string
        # '[{"tool_chain_tag": "GCCNOLTO"}]'
        default: ''
      stuart-ci-build-params:
        description: Additional Stuart CI build parameters.
        required: false
        type: string
        # NO-TARGET:  ''
        # Packages:   '--disable-all CompilerPlugin=run'
        # Unit Tests: '--disable-all DISABLE_DEBUG_MACRO_CHECK HostUnitTestCompilerPlugin=run HostBasedUnitTestRunner=run'
        # Unit Tests no code coverage: '--disable-all DISABLE_DEBUG_MACRO_CHECK HostUnitTestCompilerPlugin=run HostBasedUnitTestRunner=run CODE_COVERAGE=FALSE'
        default: ''

jobs:
  filter_packages:
    runs-on: ubuntu-latest
    outputs:
      filtered-matrix: ${{ steps.filter-matrix.outputs.filtered-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: filter-matrix
        env:
          BUILD_TYPE_LIST: ${{ inputs.build-type-list }}
          BUILD_ARCH_LIST: ${{ inputs.build-arch-list }}
          TOOL_CHAIN_TAG_LIST: ${{ inputs.tool-chain-tag-list }}
          PACKAGE_LISTS: ${{ inputs.package-lists }}
          SKIP_FILTER_LIST: ${{ inputs.skip-filter-list }}
          CONTINUE_ON_ERROR_FILTER_LIST: ${{ inputs.continue-on-error-filter-list }}
        run: python ./.github/scripts/filter_matrix.py

  build_linux_packages:
    name: Build Linux Packages (${{ matrix.config.build_arch }}-${{ matrix.config.build_type }}-${{ matrix.config.tool_chain_tag }}-${{ strategy.job-index }})
    needs: filter_packages
    if: ${{ needs.filter_packages.outputs.filtered-matrix != '[]' }}
    runs-on: ${{ inputs.linux-runs-on }}
    container:
      image: ${{ inputs.linux-container-image }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.filter_packages.outputs.filtered-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Linux CLANG Job
        uses: ./.github/actions/setup-job
        with:
          linux-host-compiler: '${{ inputs.linux-host-compiler }}'
          python-version: '${{ inputs.python-version }}'
          pip-requirements: '${{ inputs.pip-requirements }}'
          stuart-ci-settings-file: '${{ inputs.stuart-ci-settings-file }}'
          edk2-tools-build-params: '-t ${{ matrix.config.tool_chain_tag }}'
      - name: Build Packages ${{ matrix.config.tool_chain_tag }} ${{ matrix.config.build_type }} ${{ matrix.config.build_arch }}
        continue-on-error: ${{ matrix.config.continue_on_error == 'true' }}
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}" -a ${{ matrix.config.build_arch }} -t ${{ matrix.config.build_type }} TOOL_CHAIN_TAG=${{ matrix.config.tool_chain_tag }} -p ${{ matrix.config.build_package }} ${{ inputs.stuart-ci-build-params }}
      - name: Publish Unit Test Results
        if: ${{ always() && contains(inputs['stuart-ci-build-params'], 'HostBasedUnitTestRunner=run') }}
        uses: mikepenz/action-junit-report@v6.1.0
        with:
          report_paths: "Build/**/*.result.xml"
          detailed_summary: true
          include_passed: true
      - name: Generate Unit Test Code Coverage Report
        if: ${{ always() && contains(inputs['stuart-ci-build-params'], 'HostBasedUnitTestRunner=run') }}
        uses: alan-null/cobertura-to-markdown@v1
        with:
          coverage_file: "Build/coverage.xml"
          output_file: "Build/coverage.md"
      - name: Generate Unit Test HTML Coverage Report
        if: ${{ always() && contains(inputs['stuart-ci-build-params'], 'HostBasedUnitTestRunner=run') }}
        run: |
          coverage_input=""

          if [ -f "Build/all-coverage.info" ]; then
            coverage_input="Build/all-coverage.info"
          elif [ -f "Build/coverage.lcov" ]; then
            coverage_input="Build/coverage.lcov"
          fi

          if [ -n "$coverage_input" ]; then
            genhtml "$coverage_input" --output-directory Build/coverage-html --legend --branch-coverage
          else
            echo "No LCOV coverage data found. Skipping HTML coverage generation."
          fi
      - name: Add Unit Test Code Coverage Report to Job Summary
        if: ${{ always() && contains(inputs['stuart-ci-build-params'], 'HostBasedUnitTestRunner=run') }}
        run: |
          if [ -f "Build/coverage.md" ]; then
            echo "Unit Test Code Coverage Report:" >> $GITHUB_STEP_SUMMARY
            cat Build/coverage.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No code coverage report found." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Unit Test HTML Coverage Report
        if: ${{ always() && contains(inputs['stuart-ci-build-params'], 'HostBasedUnitTestRunner=run') }}
        uses: actions/upload-artifact@v6
        with:
          name: Unit Test HTML Coverage Report (${{ matrix.config.build_arch }}-${{ matrix.config.build_type }}-${{ matrix.config.tool_chain_tag }}-${{ strategy.job-index }})
          if-no-files-found: ignore
          path: Build/coverage-html
      - name: Upload Linux Packages Logs ${{ matrix.config.tool_chain_tag }} ${{ matrix.config.build_type }} ${{ matrix.config.build_arch }}
        uses: actions/upload-artifact@v6
        with:
          name: Upload Linux Packages Logs (${{ matrix.config.build_arch }}-${{ matrix.config.build_type }}-${{ matrix.config.tool_chain_tag }}-${{ strategy.job-index }})
          if-no-files-found: ignore
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
            Build/*.info
            Build/*.xml
            Build/*.lcov
            Build/*.md
            Build/**/*.result.xml
        if: always()
