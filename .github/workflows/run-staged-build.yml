## @file
# A workflow using a staged build with Ubuntu compilers and Windows compilers
# to perform a sequence of quality checks, basic acceptance tests, package
# tests, platform tests, and uploads artifacts.
#
# This top level file configures the conditions this workflow run and
# configures parameters to pass to the staged-build.yml workflow that implements
# the staged build process.
#
# Copyright (C) 2026 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Run Staged Build

on:
  workflow_dispatch:
    inputs:
      windows-runs-on:
        description: Array of Windows runner labels.
        required: false
        type: string
        default: '["windows-2025","windows-2022"]'
      llvm-version-tuples:
        description: Array of matching LLVM version tuples (vs, edk2, mingw).
        required: false
        type: string
        default: >-
          [
            {"vs":"20.1.8","edk2":"20.1.8.0","mingw":"20250709"},
            {"vs":"22.1.8","edk2":"22.1.8.0","mingw":"20260616"},
            {"vs":"23.1.6","edk2":"23.1.3.0","mingw":"20261117"}
          ]
      python-versions:
        description: Array of Python versions.
        required: false
        type: string
        default: '["3.12","3.13","3.14","3.15"]'
      enable-code-quality-tests:
        description: Enable Code Quality Tests.
        required: false
        type: boolean
        default: true
      enable-basic-acceptance-tests:
        description: Enable Basic Acceptance Tests (BAT).
        required: false
        type: boolean
        default: true
      enable-full-tests:
        description: Enable Stage 2 and later full package and platform tests.
        required: false
        type: boolean
        default: true
      enable-linux-clang-tests:
        description: Enable Linux CLANG builds and tests.
        required: false
        type: boolean
        default: true
      enable-linux-gcc-tests:
        description: Enable Linux GCC builds and tests.
        required: false
        type: boolean
        default: true
      enable-linux-gccnolto-tests:
        description: Enable Linux GCCNOLTO builds and tests.
        required: false
        type: boolean
        default: false
      enable-windows-visual-studio-tests:
        description: Enable Windows Visual Studio builds and tests.
        required: false
        type: boolean
        default: true
      enable-windows-clang-tests:
        description: Enable Windows CLANG builds and tests.
        required: false
        type: boolean
        default: true
      default-package-lists:
        description: Default package lists to use if not set in Stage 0.
        required: false
        type: string
        default: '["CryptoPkg", "MdeModulePkg,ShellPkg,UefiCpuPkg,NetworkPkg,MdePkg,UnitTestFrameworkPkg,DynamicTablesPkg,StandaloneMmPkg", "SecurityPkg,RedfishPkg,IntelFsp2Pkg,PrmPkg,SourceLevelDebugPkg,FmpDevicePkg,FatPkg,IntelFsp2WrapperPkg,ManageabilityPkg,TcgTpmPkg,EmbeddedPkg,PcAtChipsetPkg,ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,EmulatorPkg"]'
      skip-filter-list:
        description: Array of build filters to skip.
        required: false
        type: string
        default: '[{"tool_chain_tag": "GCCNOLTO", "build_arch": "RISCV64"}]'
      continue-on-error-filter-list:
        description: Array of build filters allowed to continue on error.
        required: false
        type: string
        default: '[{"tool_chain_tag": "GCCNOLTO"}]'
  pull_request:
    branches:
      - sandbox/master
      - clang_ci_v5*
  push:
    branches:
      - sandbox/master

concurrency:
  group: run-staged-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_staged_build_matrix:
    name: Prepare Staged Build Matrix
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate matrix combinations
        id: generate
        env:
          WINDOWS_RUNNERS: ${{ inputs.windows-runs-on }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          LLVM_VERSION_TUPLES: ${{ inputs.llvm-version-tuples }}
        run: |
          python3 - <<'PY'
          import json
          import os

          windows_runners = json.loads(os.environ["WINDOWS_RUNNERS"])
          python_versions = json.loads(os.environ["PYTHON_VERSIONS"])
          llvm_version_tuples = json.loads(os.environ["LLVM_VERSION_TUPLES"])

          if not windows_runners or not python_versions or not llvm_version_tuples:
              raise SystemExit("Matrix inputs must be non-empty JSON arrays.")

          matrix = {
              "include": [
                  {
                      "windows_runner": windows_runner,
                      "python": python_version,
                      **llvm_version_tuple,
                  }
                  for windows_runner in windows_runners
                  for python_version in python_versions
                  for llvm_version_tuple in llvm_version_tuples
              ]
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix)}\n")
          PY
  staged_build_dispatch:
    name: Staged Build - ${{ matrix.windows_runner }} / LLVM ${{ matrix.vs }} / Python ${{ matrix.python }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: prepare_staged_build_matrix
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare_staged_build_matrix.outputs.matrix) }}
    uses: ./.github/workflows/staged-build.yml
    with:
      linux-runs-on: 'ubuntu-24.04'
      linux-container-image: 'ghcr.io/tianocore/containers/ubuntu-24-build:latest'
      windows-qemu-installer-version: '2023.7.25'
      windows-runs-on: ${{ matrix.windows_runner }}
      vs-clang-llvm-version: ${{ matrix.vs }}
      edk2-clang-version: ${{ matrix.edk2 }}
      llvm-mingw-version: ${{ matrix.mingw }}
      python-version: ${{ matrix.python }}
      enable-code-quality-tests: ${{ inputs.enable-code-quality-tests }}
      enable-basic-acceptance-tests: ${{ inputs.enable-basic-acceptance-tests }}
      enable-full-tests: ${{ inputs.enable-full-tests }}
      enable-linux-clang-tests: ${{ inputs.enable-linux-clang-tests }}
      enable-linux-gcc-tests: ${{ inputs.enable-linux-gcc-tests }}
      enable-linux-gccnolto-tests: ${{ inputs.enable-linux-gccnolto-tests }}
      enable-windows-visual-studio-tests: ${{ inputs.enable-windows-visual-studio-tests }}
      enable-windows-clang-tests: ${{ inputs.enable-windows-clang-tests }}
      default-package-lists: ${{ inputs.default-package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
  staged_build_ci:
    name: Staged Build - CI
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    uses: ./.github/workflows/staged-build.yml
    with:
      linux-runs-on: 'ubuntu-24.04'
      linux-container-image: 'ghcr.io/tianocore/containers/ubuntu-24-build:latest'
      windows-qemu-installer-version: '2023.7.25'
      windows-runs-on: 'windows-2025'
      vs-clang-llvm-version: '22.1.8'
      edk2-clang-version: '22.1.8.0'
      llvm-mingw-version: '20260616'
      python-version: '3.12'
      enable-code-quality-tests: true
      enable-basic-acceptance-tests: true
      enable-full-tests: true
      enable-linux-clang-tests: true
      enable-linux-gcc-tests: true
      enable-linux-gccnolto-tests: false
      enable-windows-visual-studio-tests: true
      enable-windows-clang-tests: true
      skip-filter-list: '[{"tool_chain_tag": "GCCNOLTO", "build_arch": "RISCV64"}]'
      continue-on-error-filter-list: '[{"tool_chain_tag": "GCCNOLTO"}]'
