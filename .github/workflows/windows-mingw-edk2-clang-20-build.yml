## @file
# A workflow using Windows MINGW edk2-clang tools that builds packages and
# uploads artifacts.
#
# Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
# Host-Based Unit Test Build Support: CLANGDWARF          - X64
# EmulatorPkg Build Support:          CLANGDWARF          - X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Windows Mingw edk2-clang 20.1.8 Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - sandbox/master

jobs:
  build_windows_mingw_edk2_clang_precheck:
    name: Build Windows Mingw edk2-clang Precheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows Mingw edk2-clang Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: 'edk2-clang'
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          stuart-ci-settings-file: '.pytool/CISettings.py'
          edk2-tools-build-params: '-a X64 -t CLANGPDB'
      - name: Build HelloWorld CLANGPDB
        shell: cmd
        run: |
          call edksetup.bat Mingw-w64
          call build -a IA32 -a X64 -t CLANGPDB -b DEBUG -b RELEASE -b NOOPT -p MdeModulePkg/MdeModulePkg.dsc -m MdeModulePkg/Application/HelloWorld/HelloWorld.inf -j Build/HelloWorldClangPdbBuild.log >NUL
      - name: Build HelloWorld CLANGDWARF
        shell: cmd
        run: |
          call edksetup.bat Mingw-w64
          call build -a IA32 -a X64 -t CLANGDWARF -b DEBUG -b RELEASE -b NOOPT -p MdeModulePkg/MdeModulePkg.dsc -m MdeModulePkg/Application/HelloWorld/HelloWorld.inf -j Build/HelloWorldClangDwarfBuild.log >NUL
      - name: Build UnitTestFrameworkPkg X64 Unit Tests
        run: |
          stuart_ci_build -c ".pytool/CISettings.py" -a X64 -t NOOPT TOOL_CHAIN_TAG=CLANGDWARF -p UnitTestFrameworkPkg
      - name: Build EmulatorPkg X64 Host Module
        shell: cmd
        run: |
          call edksetup.bat Mingw-w64
          call build -a X64 -t CLANGDWARF -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -m EmulatorPkg/Win/Host/WinHost.inf -j Build/EmulatorX64DebugBuild.log >NUL
      - name: Build OVMF Platform CLANGPDB
        shell: cmd
        run: |
          call edksetup.bat Mingw-w64
          call build -a IA32 -a X64 -t CLANGPDB -b DEBUG -p OvmfPkg/OvmfPkgIa32X64.dsc -D SMM_REQUIRE -j Build/OvmfIa32X64BuildClangPdb.log >NUL
      - name: Upload Windows Mingw edk2-clang Precheck Logs
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows Mingw edk2-clang Precheck Logs
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()

  build_windows_mingw_edk2_clang_packages:
    name: Build Windows Mingw edk2-clang Packages (${{ join(matrix.*, ' - ') }})
    needs: build_windows_mingw_edk2_clang_precheck
    uses: ./.github/workflows/windows-clang-20-package-build-test.yml
    with:
      windows-clang-installer: 'edk2-clang'
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGPDB'
      build_type_list: '["DEBUG", "RELEASE"]'
      build_arch_list: '["IA32", "X64"]'
      tool_chain_tag_list: '["CLANGPDB", "CLANGDWARF"]'
      #package-lists: ${{ needs.set_package_lists.outputs.package-lists }}
      package-lists: '["ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,DynamicTablesPkg,EmbeddedPkg,MdeModulePkg,MdePkg,CryptoPkg", "IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,PrmPkg,NetworkPkg,SecurityPkg,ShellPkg,FmpDevicePkg,FatPkg,RedfishPkg,PcAtChipsetPkg,SignedCapsulePkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,EmulatorPkg"]'

  build_windows_mingw_edk2_clang_noopt_unit_tests:
    name: Build Windows Mingw edk2-clang Unit Tests (${{ join(matrix.*, ' - ') }})
    needs: build_windows_mingw_edk2_clang_precheck
    uses: ./.github/workflows/windows-clang-20-package-build-test.yml
    with:
      windows-clang-installer: 'edk2-clang'
      python-version: '3.12'
      pip-requirements: 'pip-requirements.txt'
      stuart-ci-settings-file: '.pytool/CISettings.py'
      edk2-tools-build-params: '-t CLANGPDB'
      build_type_list: '["NOOPT"]'
      build_arch_list: '["X64"]'
      tool_chain_tag_list: '["CLANGDWARF"]'
      #package-lists: ${{ needs.set_package_lists.outputs.package-lists }}
      package-lists: '["ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,DynamicTablesPkg,EmbeddedPkg,MdeModulePkg,MdePkg,CryptoPkg", "IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,PrmPkg,NetworkPkg,SecurityPkg,ShellPkg,FmpDevicePkg,FatPkg,RedfishPkg,PcAtChipsetPkg,SignedCapsulePkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,EmulatorPkg"]'

  build_windows_mingw_edk2_clang_emulatorpkg:
    name: Build Windows Mingw edk2-clang EmulatorPkg
    needs: build_windows_mingw_edk2_clang_precheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows Mingw edk2-clang Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: 'edk2-clang'
          python-version: '3.12'
          pip-requirements: 'pip-requirements.txt'
          stuart-ci-settings-file: '.pytool/CISettings.py'
          edk2-tools-build-params: '-a X64 -t CLANGDWARF'
      - name: Build Windows Mingw edk2-clang EmulatorPkg
        shell: cmd
        run: |
          call edksetup.bat Mingw-w64
          call build -a X64 -t CLANGDWARF -b NOOPT   -p EmulatorPkg/EmulatorPkg.dsc -D SECURE_BOOT_ENABLE   -j Build/EmulatorX64NooptBuild.log >NUL
          call build -a X64 -t CLANGDWARF -b DEBUG   -p EmulatorPkg/EmulatorPkg.dsc -D NETWORK_ENABLE=FALSE -j Build/EmulatorX64DebugBuild.log >NUL
          call build -a X64 -t CLANGDWARF -b RELEASE -p EmulatorPkg/EmulatorPkg.dsc                         -j Build/EmulatorX64ReleaseBuild.log >NUL
      - name: Upload Windows Mingw edk2-clang EmulatorPkg Logs
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows Mingw edk2-clang EmulatorPkg Logs
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()
