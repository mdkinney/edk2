## @file
# A workflow using Windows to run package builds and uploads artifacts.
#
# Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
# Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
# EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Windows CLANG 20.1.8 Build Packages Test

on:
  workflow_call:
    inputs:
      windows-runs-on:
        description: 'The runner label for Windows jobs (e.g. windows-2025).'
        required: true
        type: string
      windows-clang-installer:
        description: 'Windows CLANG installer (e.g., edk2-clang, llvm, vs-clangpdb, or none)'
        required: true
        type: string
        default: 'none'
      python-version:
        description: 'The version of Python to use.'
        required: true
        type: string
        default: '3.12'
      pip-requirements:
        description: 'Path to pip requirements file'
        required: true
        type: string
        default: 'pip-requirements.txt'
      stuart-ci-settings-file:
        description: 'The path to the Stuart CI settings file.'
        required: true
        type: string
        default: '.pytool/CISettings.py'
      edk2-tools-build-params:
        description: 'The EDK2 Tools build parameters.'
        required: true
        type: string
        default: '-t CLANGPDB'
      build_type_list:
        description: 'List of build types to test.'
        required: true
        type: string
        default: '["DEBUG", "RELEASE"]'
      build_arch_list:
        description: 'List of build architectures to test.'
        required: true
        type: string
        default: '["IA32", "X64"]'
      tool_chain_tag_list:
        description: 'List of tool chain tags to test.'
        required: true
        type: string
        default: '["CLANGPDB", "CLANGDWARF"]'
      package-lists:
        description: 'List of package lists to test.'
        required: true
        type: string
        default: '["ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,DynamicTablesPkg,EmbeddedPkg,MdeModulePkg,MdePkg,CryptoPkg", "IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,PrmPkg,NetworkPkg,SecurityPkg,ShellPkg,FmpDevicePkg,FatPkg,RedfishPkg,PcAtChipsetPkg,SignedCapsulePkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,EmulatorPkg"]'

jobs:
  build_windows_packages:
    name: Build Windows Packages ${{inputs.windows-clang-installer}}-${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }}
    runs-on: ${{ inputs.windows-runs-on }}
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(inputs.build_type_list) }}
        build_arch: ${{ fromJSON(inputs.build_arch_list) }}
        tool_chain_tag: ${{ fromJSON(inputs.tool_chain_tag_list) }}
        build_package: ${{ fromJSON(inputs.package-lists) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Windows CLANG Job
        uses: ./.github/actions/windows-setup-clang-job
        with:
          windows-clang-installer: ${{ inputs.windows-clang-installer }}
          python-version: ${{ inputs.python-version }}
          pip-requirements: ${{ inputs.pip-requirements }}
          stuart-ci-settings-file: ${{ inputs.stuart-ci-settings-file }}
          edk2-tools-build-params: ${{ inputs.edk2-tools-build-params }}
      - name: Build Packages ${{ matrix.build_package }}
        shell: cmd
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}" -a ${{ matrix.build_arch }} -t ${{ matrix.build_type }} TOOL_CHAIN_TAG=${{ matrix.tool_chain_tag }} -p "${{ matrix.build_package }}"
      - name: Upload Windows Packages Logs ${{inputs.windows-clang-installer}}-${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }}
        uses: actions/upload-artifact@v6
        with:
          name: Upload Windows Packages Logs ${{inputs.windows-clang-installer}}-${{ matrix.build_arch }}-${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }}
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()


