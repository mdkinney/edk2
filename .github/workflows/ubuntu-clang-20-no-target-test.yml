## @file
# A workflow using Ubuntu CLANG tools to run all NO-TARGET quality checks
# on packages and uploads artifacts.
#
# Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
# Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
# EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
#
# Copyright (C) 2025 Intel Corporation.
# SPDX-License-Identifier: BSD-2-Clause-Patent
##
name: Ubuntu CLANG 20.1.8 NO-TARGET Quality Checks

on:
  workflow_call:
  inputs:
    python-version:
      description: 'The version of Python to use.'
      required: true
      type: string
      default: '3.12'
    stuart-ci-settings-file:
      description: 'The path to the Stuart CI settings file.'
      required: true
      type: string
      default: '.pytool/CISettings.py'
    edk2-tools-build-params:
      description: 'The EDK2 Tools build parameters.'
      required: true
      type: string
      default: '-t CLANGPDB'
    package-lists:
      description: 'List of package lists to test.'
      required: true
      type: string
      default: |
        ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,DynamicTablesPkg,EmbeddedPkg,MdeModulePkg,MdePkg,CryptoPkg
        IntelFsp2Pkg,IntelFsp2WrapperPkg,UefiCpuPkg,PrmPkg,NetworkPkg,SecurityPkg,ShellPkg,FmpDevicePkg,FatPkg,RedfishPkg,PcAtChipsetPkg,SignedCapsulePkg,SourceLevelDebugPkg,UnitTestFrameworkPkg,StandaloneMmPkg,EmulatorPkg

jobs:
  build_linux_clang_no_target_test:
    name: Linux ${{ matrix.tool_chain_tag }} ${{ matrix.build_type }} Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mdkinney/containers/ubuntu-24-build:latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - NO-TARGET
        tool_chain_tag:
          - CLANGPDB
        build_package: ${{ fromJson(inputs.package-lists) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Ensure safe directory for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Linux CLANG Job
        uses: ./.github/actions/linux-setup-clang-job
        with:
          python-version: '${{ inputs.python-version }}'
          stuart-ci-settings-file: '${{ inputs.stuart-ci-settings-file }}'
          edk2-tools-build-params: '${{ inputs.edk2-tools-build-params }}'
      - name: Build Packages ${{ matrix.tool_chain_tag }} ${{ matrix.build_type }}
        run: |
          stuart_ci_build -c "${{ inputs.stuart-ci-settings-file }}" -t ${{ matrix.build_type }} -p "${{ matrix.build_package }}"
      - name: Upload Linux ${{ matrix.tool_chain_tag }} ${{ matrix.build_type }} Logs
        uses: actions/upload-artifact@v4
        with:
          name: Upload Linux Logs (${{ matrix.build_type }}-${{ matrix.tool_chain_tag }}-${{ strategy.job-index }})
          path: |
            BaseTools/BaseToolsBuild/*.txt
            Build/**/BUILDLOG*.txt
            Build/*.txt
            Build/*.log
        if: always()
