##
name: Staged Build

on:
  workflow_call:
    inputs:
      linux-runs-on:
        description: The runner label for Linux jobs.
        required: false
        type: string
        default: 'ubuntu-24.04'
      linux-container-image:
        description: The container image for Linux jobs.
        required: false
        type: string
        default: 'ghcr.io/tianocore/containers/ubuntu-24-build:latest'
      linux-container-image-qemu:
        description: The container image for Linux jobs with QEMU.
        required: false
        type: string
        default: 'ghcr.io/tianocore/containers/ubuntu-24-test:latest'
      windows-runs-on:
        description: Windows runner; windows-2022 uses VS2022, others use VS2026.
        required: false
        type: string
        default: 'windows-2025'
      vs-clang-llvm-version:
        description: LLVM version for Windows Visual Studio CLANGPDB jobs.
        required: false
        type: string
        default: '22.1.8'
      edk2-clang-version:
        description: EDK2 Clang version for Windows MinGW jobs.
        required: false
        type: string
        default: '22.1.8.0'
      llvm-mingw-version:
        description: 'LLVM MinGW Release (YYYYMMDD): 20250709=LLVM 20.1.8; 20260616=22.1.8; 20261117=23.1.6.'
        required: false
        type: string
        default: '20260616'
      windows-qemu-installer-version:
        description: Windows QEMU installer (e.g., 2023.7.25)
        required: true
        type: string
        default: '2023.7.25'
      python-version:
        description: Python version or version spec to use.
        required: true
        type: string
        default: '3.12'
      enable-code-quality-tests:
        description: Enable Code Quality Tests
        required: false
        type: boolean
        default: true
      enable-basic-acceptance-tests:
        description: Enable Basic Acceptance Tests (BAT)
        required: false
        type: boolean
        default: true
      enable-linux-clang-tests:
        description: Enable Linux CLANG builds and tests
        required: false
        type: boolean
        default: true
      enable-linux-gcc-tests:
        description: Enable Linux GCC builds and tests
        required: false
        type: boolean
        default: true
      enable-linux-gccnolto-tests:
        description: Enable Linux GCCNOLTO builds and tests
        required: false
        type: boolean
        default: false
      enable-windows-visual-studio-tests:
        description: Enable Windows Visual Studio builds and tests
        required: false
        type: boolean
        default: true
      enable-windows-clang-tests:
        description: Enable Windows CLANG builds and tests
        required: false
        type: boolean
        default: true
      default-package-lists:
        description: Default package lists to use if not set in Stage 0.
        required: false
        type: string
        default: '["CryptoPkg", "MdeModulePkg,ShellPkg,UefiCpuPkg,NetworkPkg,MdePkg,UnitTestFrameworkPkg,DynamicTablesPkg,StandaloneMmPkg", "SecurityPkg,RedfishPkg,IntelFsp2Pkg,PrmPkg,SourceLevelDebugPkg,FmpDevicePkg,FatPkg,IntelFsp2WrapperPkg,ManageabilityPkg,TcgTpmPkg,EmbeddedPkg,PcAtChipsetPkg,ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,EmulatorPkg"]'
      skip-filter-list:
        description: List of filter criteria to skip.
        required: false
        type: string
        default: '[{"tool_chain_tag": "GCCNOLTO", "build_arch": "RISCV64"}]'
      continue-on-error-filter-list:
        description: List of filter criteria to continue on error.
        required: false
        type: string
        default: '[{"tool_chain_tag": "GCCNOLTO"}]'

  workflow_dispatch:
    inputs:
      linux-runs-on:
        description: The runner label for Linux jobs.
        required: false
        type: string
        default: 'ubuntu-24.04'
      linux-container-image:
        description: The container image for Linux jobs.
        required: false
        type: string
        default: 'ghcr.io/tianocore/containers/ubuntu-24-build:latest'
      linux-container-image-qemu:
        description: The container image for Linux jobs with QEMU.
        required: false
        type: string
        default: 'ghcr.io/tianocore/containers/ubuntu-24-test:latest'
      windows-runs-on:
        description: Windows runner; windows-2022 uses VS2022, others use VS2026.
        required: false
        type: choice
        options:
          - 'windows-2025'
          - 'windows-2022'
        default: 'windows-2025'
      vs-clang-llvm-version:
        description: Select a known LLVM version for Windows Visual Studio CLANGPDB jobs.
        required: false
        type: choice
        options:
          - '20.1.8'
          - '22.1.8'
          - '23.1.6'
        default: '22.1.8'
      vs-clang-llvm-version-override:
        description: Optional custom LLVM version to evaluate; overrides the selected version.
        required: false
        type: string
        default: ''
      edk2-clang-version:
        description: Select a known EDK2 Clang version for Windows MinGW jobs.
        required: false
        type: choice
        options:
          - '20.1.8.0'
          - '22.1.8.0'
          - '23.1.3.0'
        default: '22.1.8.0'
      edk2-clang-version-override:
        description: Optional custom EDK2 Clang version to evaluate; overrides the selected version.
        required: false
        type: string
        default: ''
      llvm-mingw-version:
        description: 'LLVM MinGW Release (YYYYMMDD): 20250709=LLVM 20.1.8; 20260616=22.1.8; 20261117=23.1.6.'
        required: false
        type: choice
        options:
          - '20250709'  # LLVM 20.1.8
          - '20260616'  # LLVM 22.1.8
          - '20261117'  # LLVM 23.1.6
        default: '20260616'
      llvm-mingw-version-override:
        description: Optional custom LLVM MinGW release date (YYYYMMDD); overrides the selected date.
        required: false
        type: string
        default: ''
      windows-qemu-installer-version:
        description: Windows QEMU installer (e.g., 2023.7.25)
        required: true
        type: string
        default: '2023.7.25'
      python-version:
        description: Select the Python version to use.
        required: true
        type: choice
        options:
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        default: '3.12'
      python-version-override:
        description: Optional custom Python version or spec; overrides the selected version.
        required: false
        type: string
        default: ''
      enable-code-quality-tests:
        description: Enable Code Quality Tests
        required: false
        type: boolean
        default: true
      enable-basic-acceptance-tests:
        description: Enable Basic Acceptance Tests (BAT)
        required: false
        type: boolean
        default: true
      enable-linux-clang-tests:
        description: Enable Linux CLANG builds and tests
        required: false
        type: boolean
        default: true
      enable-linux-gcc-tests:
        description: Enable Linux GCC builds and tests
        required: false
        type: boolean
        default: true
      enable-linux-gccnolto-tests:
        description: Enable Linux GCCNOLTO builds and tests
        required: false
        type: boolean
        default: false
      enable-windows-visual-studio-tests:
        description: Enable Windows Visual Studio builds and tests
        required: false
        type: boolean
        default: true
      enable-windows-clang-tests:
        description: Enable Windows CLANG builds and tests
        required: false
        type: boolean
        default: true
      default-package-lists:
        description: Default package lists to use if not set in Stage 0.
        required: false
        type: string
        default: '["CryptoPkg", "MdeModulePkg,ShellPkg,UefiCpuPkg,NetworkPkg,MdePkg,UnitTestFrameworkPkg,DynamicTablesPkg,StandaloneMmPkg", "SecurityPkg,RedfishPkg,IntelFsp2Pkg,PrmPkg,SourceLevelDebugPkg,FmpDevicePkg,FatPkg,IntelFsp2WrapperPkg,ManageabilityPkg,TcgTpmPkg,EmbeddedPkg,PcAtChipsetPkg,ArmPkg,ArmPlatformPkg,ArmVirtPkg,OvmfPkg,EmulatorPkg"]'
      skip-filter-list:
        description: List of filter criteria to skip.
        required: false
        type: string
        default: '[{"tool_chain_tag": "GCCNOLTO", "build_arch": "RISCV64"}]'
      continue-on-error-filter-list:
        description: List of filter criteria to continue on error.
        required: false
        type: string
        default: '[{"tool_chain_tag": "GCCNOLTO"}]'

env:
  PIP_REQUIREMENTS: 'pip-requirements.txt'
  STUART_CI_SETTINGS_FILE: '.pytool/CISettings.py'

concurrency:
  group: staged-build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve_inputs:
    name: Resolve Workflow Inputs
    runs-on: ubuntu-slim
    outputs:
      python_version: ${{ steps.resolve-versions.outputs.python_version }}
      vs_version: ${{ steps.resolve-versions.outputs.vs_version }}
      vs_clang_llvm_version: ${{ steps.resolve-versions.outputs.vs_clang_llvm_version }}
      edk2_clang_version: ${{ steps.resolve-versions.outputs.edk2_clang_version }}
      llvm_mingw_version: ${{ steps.resolve-versions.outputs.llvm_mingw_version }}
      pip_requirements: ${{ steps.resolve-versions.outputs.pip_requirements }}
      stuart_ci_settings_file: ${{ steps.resolve-versions.outputs.stuart_ci_settings_file }}
    steps:
      - name: Resolve Python and compiler versions
        id: resolve-versions
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
          PYTHON_VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.python-version-override || '' }}
          WINDOWS_RUNS_ON: ${{ inputs.windows-runs-on }}
          VS_LLVM_SELECTED_VERSION: ${{ inputs.vs-clang-llvm-version }}
          VS_LLVM_VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.vs-clang-llvm-version-override || '' }}
          EDK2_CLANG_SELECTED_VERSION: ${{ inputs.edk2-clang-version }}
          EDK2_CLANG_VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.edk2-clang-version-override || '' }}
          LLVM_MINGW_VERSION: ${{ inputs.llvm-mingw-version }}
          LLVM_MINGW_VERSION_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.llvm-mingw-version-override || '' }}
          PIP_REQUIREMENTS_INPUT: ${{ env.PIP_REQUIREMENTS }}
          STUART_CI_SETTINGS_FILE_INPUT: ${{ env.STUART_CI_SETTINGS_FILE }}
        shell: bash
        run: |
          python_version="${PYTHON_VERSION_OVERRIDE:-$PYTHON_VERSION}"
          if [[ -z "$python_version" ]]; then
            echo "::error::A Python version or version spec must be provided."
            exit 1
          fi

          vs_clang_llvm_version="${VS_LLVM_VERSION_OVERRIDE:-$VS_LLVM_SELECTED_VERSION}"
          if [[ ! "$vs_clang_llvm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid VS LLVM version '$vs_clang_llvm_version'. Expected a version such as 22.1.8."
            exit 1
          fi

          edk2_clang_version="${EDK2_CLANG_VERSION_OVERRIDE:-$EDK2_CLANG_SELECTED_VERSION}"
          if [[ ! "$edk2_clang_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid EDK2 Clang version '$edk2_clang_version'. Expected a version such as 22.1.8.0."
            exit 1
          fi

          llvm_mingw_version="${LLVM_MINGW_VERSION_OVERRIDE:-$LLVM_MINGW_VERSION}"
          if [[ ! "$llvm_mingw_version" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Invalid LLVM MinGW release date '$llvm_mingw_version'. Expected YYYYMMDD."
            exit 1
          fi

          case "$WINDOWS_RUNS_ON" in
            windows-2022)
              vs_version='VS2022'
              ;;
            windows-2025)
              vs_version='VS2026'
              ;;
            *)
              vs_version='VS2026'
              ;;
          esac

          printf 'python_version=%s\n' "$python_version" >> "$GITHUB_OUTPUT"
          printf 'vs_version=%s\n' "$vs_version" >> "$GITHUB_OUTPUT"
          printf 'vs_clang_llvm_version=%s\n' "$vs_clang_llvm_version" >> "$GITHUB_OUTPUT"
          printf 'edk2_clang_version=%s\n' "$edk2_clang_version" >> "$GITHUB_OUTPUT"
          printf 'llvm_mingw_version=%s\n' "$llvm_mingw_version" >> "$GITHUB_OUTPUT"
          printf 'pip_requirements=%s\n' "$PIP_REQUIREMENTS_INPUT" >> "$GITHUB_OUTPUT"
          printf 'stuart_ci_settings_file=%s\n' "$STUART_CI_SETTINGS_FILE_INPUT" >> "$GITHUB_OUTPUT"

  #
  # Stage 0: Set Package Lists and run PatchCheck
  #
  set_package_lists:
    name: Set Package Lists
    needs: resolve_inputs
    uses: ./.github/workflows/ubuntu-set-package-lists-and-patch-check.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      python-version: ${{ needs.resolve_inputs.outputs.python_version }}
      pip-requirements: ${{ needs.resolve_inputs.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.resolve_inputs.outputs.stuart_ci_settings_file }}
      default-package-lists: ${{ inputs.default-package-lists }}
      run-patch-check: ${{ inputs.enable-code-quality-tests }}

  #
  # Stage 0 Success
  #
  stage0:
    name: Stage 0 Success
    runs-on: ubuntu-slim
    needs:
      - set_package_lists
      - resolve_inputs
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    outputs:
      package-lists: ${{ needs.set_package_lists.outputs.package-lists }}
      vs_clang_llvm_version: ${{ needs.resolve_inputs.outputs.vs_clang_llvm_version }}
      edk2_clang_version: ${{ needs.resolve_inputs.outputs.edk2_clang_version }}
      llvm_mingw_version: ${{ needs.resolve_inputs.outputs.llvm_mingw_version }}
      python_version: ${{ needs.resolve_inputs.outputs.python_version }}
      vs_version: ${{ needs.resolve_inputs.outputs.vs_version }}
      pip_requirements: ${{ needs.resolve_inputs.outputs.pip_requirements }}
      stuart_ci_settings_file: ${{ needs.resolve_inputs.outputs.stuart_ci_settings_file }}
    steps:
      - name: Stage 0 Success
        run: echo "Stage 0 jobs completed successfully"

  #
  # Stage 1: Run no-target tests and basic acceptance tests
  #
  build_linux_clang_no_target_test:
    name: Code Quality Tests
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-code-quality-tests }}
    uses: ./.github/workflows/ubuntu-package-build-test.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-host-compiler: 'clang'
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t CLANGPDB'
      build-type-list: '["NO-TARGET"]'
      #
      # build-arch-list is ignored for NO-TARGET but set to arbitrary value to
      # satisfy workflow call input requirements.
      #
      build-arch-list: '["X64"]'
      tool-chain-tag-list: '["CLANGPDB"]'
      package-lists: ${{ needs.stage0.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
  build_linux_clangdwarf_basic_acceptance_test:
    name: Basic Acceptance Tests - Linux CLANGDWARF
    # Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64/AARCH64/RISCV64
    # Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
    # EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-linux-clang-tests }}
    uses: ./.github/workflows/ubuntu-basic-acceptance-test.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      linux-host-compiler: 'gcc'
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t CLANGPDB'
      firmware-test-arch-parameter: 'IA32,X64,AARCH64,RISCV64'
      firmware-tool-chain-tag: 'CLANGDWARF'
      unit-test-arch-list: '["IA32","X64"]'
      unit-test-tool-chain-tag: 'CLANGDWARF'
      emulatorpkg-target-list: '["DEBUG", "RELEASE", "NOOPT"]'
  build_linux_clangpdb_basic_acceptance_test:
    name: Basic Acceptance Tests - Linux CLANGPDB
    # Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64/AARCH64/RISCV64
    # Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
    # EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-linux-clang-tests }}
    uses: ./.github/workflows/ubuntu-basic-acceptance-test.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      linux-host-compiler: 'gcc'
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t CLANGPDB'
      firmware-test-arch-parameter: 'IA32,X64'
      firmware-tool-chain-tag: 'CLANGPDB'
      unit-test-arch-list: ''
      unit-test-tool-chain-tag: ''
      emulatorpkg-target-list: ''
  build_windows_mingw_edk2_clangdwarf_basic_acceptance_test:
    name: Basic Acceptance Tests - Windows MinGW EDK2 CLANGDWARF
    # Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
    # Host-Based Unit Test Build Support: CLANGDWARF          - X64
    # EmulatorPkg Build Support:          CLANGDWARF          - X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-basic-acceptance-test.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      windows-installer: 'edk2-clang'
      edk2-clang-version: ${{ needs.stage0.outputs.edk2_clang_version }}
      windows-qemu-installer-version: ${{ inputs.windows-qemu-installer-version }}
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-a X64 -t CLANGPDB'
      firmware-test-arch-parameter: 'IA32,X64'
      firmware-tool-chain-tag: 'CLANGDWARF'
      unit-test-arch-list: '["X64"]'
      unit-test-tool-chain-tag: 'CLANGDWARF'
  build_windows_mingw_edk2_clangpdb_basic_acceptance_test:
    name: Basic Acceptance Tests - Windows MinGW EDK2 CLANGDWARF
    # Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
    # Host-Based Unit Test Build Support: CLANGDWARF          - IA32
    # EmulatorPkg Build Support:          CLANGDWARF          - IA32
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-basic-acceptance-test.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      windows-installer: 'edk2-clang'
      edk2-clang-version: ${{ needs.stage0.outputs.edk2_clang_version }}
      windows-qemu-installer-version: ${{ inputs.windows-qemu-installer-version }}
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-a X64 -t CLANGPDB'
      firmware-test-arch-parameter: 'IA32,X64'
      firmware-tool-chain-tag: 'CLANGPDB'
      unit-test-arch-list: ''
      unit-test-tool-chain-tag: ''
      emulatorpkg-target-list: ''
  build_windows_mingw_llvm_20_clang_basic_acceptance_test:
    name: Basic Acceptance Tests - Windows MinGW LLVM ${{ needs.stage0.outputs.llvm_mingw_version }} CLANG
    # Firmware Build Support:             CLANGDWARF - IA32/X64
    # Host-Based Unit Test Build Support: CLANGDWARF - IA32/X64
    # EmulatorPkg Build Support:          CLANGDWARF - IA32/X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-basic-acceptance-test.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      windows-installer: 'llvm'
      llvm-mingw-version: ${{ needs.stage0.outputs.llvm_mingw_version }}
      windows-qemu-installer-version: ${{ inputs.windows-qemu-installer-version }}
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-a X64 -t CLANGDWARF'
      firmware-test-arch-parameter: 'IA32,X64'
      firmware-tool-chain-tag: 'CLANGDWARF'
      unit-test-arch-list: '["IA32","X64"]'
      unit-test-tool-chain-tag: 'CLANGDWARF'
  build_windows_vs_llvm_20_clang_basic_acceptance_test:
    name: >-
      Basic Acceptance Tests - Windows ${{ needs.stage0.outputs.vs_version }}
      LLVM ${{ needs.stage0.outputs.vs_clang_llvm_version }} CLANG
    # Firmware Build Support:             CLANGPDB - IA32/X64
    # Host-Based Unit Test Build Support: CLANGPDB - IA32/X64
    # EmulatorPkg Build Support:          CLANGPDB - IA32/X64
    needs: stage0
    if: ${{ inputs.enable-basic-acceptance-tests && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-basic-acceptance-test.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      windows-installer: 'vs-clangpdb'
      vs-clang-llvm-version: ${{ needs.stage0.outputs.vs_clang_llvm_version }}
      windows-qemu-installer-version: ${{ inputs.windows-qemu-installer-version }}
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t ${{ needs.stage0.outputs.vs_version }}'
      firmware-test-arch-parameter: 'IA32,X64'
      firmware-tool-chain-tag: 'CLANGPDB'
      unit-test-arch-list: '["IA32","X64"]'
      unit-test-tool-chain-tag: 'CLANGPDB'
  build_linux_gcc_basic_acceptance_test:
    name: Basic Acceptance Tests - Linux GCC
    # Firmware Build Support:             GCC          - IA32/X64/AARCH64/RISCV64
    # Firmware Build Support:             GCCNOLTO     - IA32/X64/AARCH64
    # Host-Based Unit Test Build Support: GCC/GCCNOLTO - IA32/X64
    # EmulatorPkg Build Support:          GCC/GCCNOLTO - IA32/X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-linux-gcc-tests }}
    uses: ./.github/workflows/ubuntu-basic-acceptance-test.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      linux-host-compiler: 'gcc'
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t GCC'
      firmware-test-arch-parameter: 'IA32,X64,AARCH64,RISCV64'
      firmware-tool-chain-tag: 'GCC'
      unit-test-arch-list: '["IA32","X64"]'
      unit-test-tool-chain-tag: 'GCC'
      emulatorpkg-target-list: '["DEBUG", "RELEASE", "NOOPT"]'
  build_linux_gccnolto_basic_acceptance_test:
    name: Basic Acceptance Tests - Linux GCCNOLTO
    # Firmware Build Support:             GCC          - IA32/X64/AARCH64/RISCV64
    # Firmware Build Support:             GCCNOLTO     - IA32/X64/AARCH64
    # Host-Based Unit Test Build Support: GCC/GCCNOLTO - IA32/X64
    # EmulatorPkg Build Support:          GCC/GCCNOLTO - IA32/X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-linux-gccnolto-tests }}
    uses: ./.github/workflows/ubuntu-basic-acceptance-test.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      linux-host-compiler: 'gcc'
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t GCC'
      firmware-test-arch-parameter: 'IA32,X64,AARCH64'
      firmware-tool-chain-tag: 'GCCNOLTO'
      unit-test-arch-list: '["IA32","X64"]'
      unit-test-tool-chain-tag: 'GCCNOLTO'
      emulatorpkg-target-list: '["DEBUG", "RELEASE", "NOOPT"]'
  build_windows_vs_basic_acceptance_test:
    name: Basic Acceptance Tests - Windows ${{ needs.stage0.outputs.vs_version }}
    # Firmware Build Support:             VS20xx - IA32/X64
    # Host-Based Unit Test Build Support: VS20xx - IA32/X64
    # EmulatorPkg Build Support:          VS20xx - IA32/X64
    needs: stage0
    if: ${{ !cancelled() && inputs.enable-basic-acceptance-tests && inputs.enable-windows-visual-studio-tests }}
    uses: ./.github/workflows/windows-basic-acceptance-test.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      windows-installer: 'vs'
      windows-qemu-installer-version: ${{ inputs.windows-qemu-installer-version }}
      python-version: ${{ needs.stage0.outputs.python_version }}
      pip-requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
      edk2-tools-build-params: '-t ${{ needs.stage0.outputs.vs_version }}'
      firmware-test-arch-parameter: 'IA32,X64'
      firmware-tool-chain-tag: ${{ needs.stage0.outputs.vs_version }}
      unit-test-arch-list: '["IA32","X64"]'
      unit-test-tool-chain-tag: ${{ needs.stage0.outputs.vs_version }}

  #
  # Stage 1 Success
  #
  stage1:
    name: Stage 1 Success
    runs-on: ubuntu-slim
    needs:
      - stage0
      - build_linux_clang_no_target_test
      - build_linux_clangpdb_basic_acceptance_test
      - build_linux_clangdwarf_basic_acceptance_test
      - build_linux_gcc_basic_acceptance_test
      - build_linux_gccnolto_basic_acceptance_test
      - build_windows_mingw_edk2_clangdwarf_basic_acceptance_test
      - build_windows_mingw_edk2_clangpdb_basic_acceptance_test
      - build_windows_mingw_llvm_20_clang_basic_acceptance_test
      - build_windows_vs_llvm_20_clang_basic_acceptance_test
      - build_windows_vs_basic_acceptance_test
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    outputs:
      package-lists: ${{ needs.stage0.outputs.package-lists }}
      vs_clang_llvm_version: ${{ needs.stage0.outputs.vs_clang_llvm_version }}
      edk2_clang_version: ${{ needs.stage0.outputs.edk2_clang_version }}
      llvm_mingw_version: ${{ needs.stage0.outputs.llvm_mingw_version }}
      python_version: ${{ needs.stage0.outputs.python_version }}
      vs_version: ${{ needs.stage0.outputs.vs_version }}
      pip_requirements: ${{ needs.stage0.outputs.pip_requirements }}
      stuart_ci_settings_file: ${{ needs.stage0.outputs.stuart_ci_settings_file }}
    steps:
      - name: Stage 1 Success
        run: echo "Stage 1 jobs completed successfully"

  #
  # Stage 2: Run full tests for packages and platforms
  #
  ubuntu_clang_build:
    # Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64/AARCH64/RISCV64
    # Host-Based Unit Test Build Support: CLANGDWARF          - IA32/X64
    # EmulatorPkg Build Support:          CLANGDWARF          - IA32/X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-linux-clang-tests }}
    uses: ./.github/workflows/ubuntu-clang-build.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      python-version: ${{ needs.stage1.outputs.python_version }}
      pip-requirements: ${{ needs.stage1.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage1.outputs.stuart_ci_settings_file }}
      package-lists: ${{ needs.stage1.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
  windows_mingw_edk2_clang_20_build:
    # Firmware Build Support:             CLANGPDB/CLANGDWARF - IA32/X64
    # Host-Based Unit Test Build Support: CLANGDWARF          - X64
    # EmulatorPkg Build Support:          CLANGDWARF          - X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-mingw-edk2-clang-20-build.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      edk2-clang-version: ${{ needs.stage1.outputs.edk2_clang_version }}
      python-version: ${{ needs.stage1.outputs.python_version }}
      pip-requirements: ${{ needs.stage1.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage1.outputs.stuart_ci_settings_file }}
      package-lists: ${{ needs.stage1.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
  windows_mingw_llvm_20_clang_build:
    name: Windows MinGW LLVM ${{ needs.stage1.outputs.llvm_mingw_version }} CLANG Build
    # Firmware Build Support:             CLANGDWARF - IA32/X64
    # Host-Based Unit Test Build Support: CLANGDWARF - IA32/X64
    # EmulatorPkg Build Support:          CLANGDWARF - IA32/X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-mingw-llvm-20-clang-build.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      llvm-mingw-version: ${{ needs.stage1.outputs.llvm_mingw_version }}
      python-version: ${{ needs.stage1.outputs.python_version }}
      pip-requirements: ${{ needs.stage1.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage1.outputs.stuart_ci_settings_file }}
      package-lists: ${{ needs.stage1.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
  windows_vs_llvm_20_clang_build:
    name: >-
      Windows CLANGPDB - ${{ needs.stage1.outputs.vs_version }} / LLVM
      ${{ needs.stage1.outputs.vs_clang_llvm_version }}
    # Firmware Build Support:             CLANGPDB - IA32/X64
    # Host-Based Unit Test Build Support: CLANGPDB - IA32/X64
    # EmulatorPkg Build Support:          CLANGPDB - IA32/X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-windows-clang-tests }}
    uses: ./.github/workflows/windows-vs-llvm-20-clang-build.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      vs-version: ${{ needs.stage1.outputs.vs_version }}
      vs-clang-llvm-version: ${{ needs.stage1.outputs.vs_clang_llvm_version }}
      python-version: ${{ needs.stage1.outputs.python_version }}
      pip-requirements: ${{ needs.stage1.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage1.outputs.stuart_ci_settings_file }}
      package-lists: ${{ needs.stage1.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
  ubuntu_gcc_build:
    # Firmware Build Support:             GCC          - IA32/X64/AARCH64/RISCV64
    # Firmware Build Support:             GCCNOLTO     - IA32/X64/AARCH64
    # Host-Based Unit Test Build Support: GCC/GCCNOLTO - IA32/X64
    # EmulatorPkg Build Support:          GCC/GCCNOLTO - IA32/X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-linux-gcc-tests }}
    uses: ./.github/workflows/ubuntu-gcc-build.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      python-version: ${{ needs.stage1.outputs.python_version }}
      pip-requirements: ${{ needs.stage1.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage1.outputs.stuart_ci_settings_file }}
      package-lists: ${{ needs.stage1.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
      tool-chain-tag-list: '["GCC"]'
  ubuntu_gccnolto_build:
    # Firmware Build Support:             GCC          - IA32/X64/AARCH64/RISCV64
    # Firmware Build Support:             GCCNOLTO     - IA32/X64/AARCH64
    # Host-Based Unit Test Build Support: GCC/GCCNOLTO - IA32/X64
    # EmulatorPkg Build Support:          GCC/GCCNOLTO - IA32/X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-linux-gccnolto-tests }}
    uses: ./.github/workflows/ubuntu-gcc-build.yml
    with:
      linux-runs-on: ${{ inputs.linux-runs-on }}
      linux-container-image: ${{ inputs.linux-container-image }}
      linux-container-image-qemu: ${{ inputs.linux-container-image-qemu }}
      python-version: ${{ needs.stage1.outputs.python_version }}
      pip-requirements: ${{ needs.stage1.outputs.pip_requirements }}
      stuart-ci-settings-file: ${{ needs.stage1.outputs.stuart_ci_settings_file }}
      package-lists: ${{ needs.stage1.outputs.package-lists }}
      skip-filter-list: ${{ inputs.skip-filter-list }}
      continue-on-error-filter-list: ${{ inputs.continue-on-error-filter-list }}
      tool-chain-tag-list: '["GCCNOLTO"]'
  windows_vs_build:
    name: Windows Visual Studio - ${{ needs.stage1.outputs.vs_version }}
    # Firmware Build Support:             VS20xx - IA32/X64
    # Host-Based Unit Test Build Support: VS20xx - IA32/X64
    # EmulatorPkg Build Support:          VS20xx - IA32/X64
    needs: stage1
    if: ${{ !cancelled() && inputs.enable-windows-visual-studio-tests }}
    uses: ./.github/workflows/windows-vs-build.yml
    with:
      windows-runs-on: ${{ inputs.windows-runs-on }}
      vs-version: ${{ needs.stage1.outputs.vs_version }}
      python-version: ${{ needs.stage1.outputs.python_version }}
